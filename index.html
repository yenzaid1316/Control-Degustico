<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Control DEGUSTICO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f0f0f; --bg2:#1a1a1a; --bg3:#242424; --bg4:#2e2e2e;
  --border:#333; --border2:#444;
  --txt:#f0ede8; --txt2:#c8c2bb; --txt3:#9a948d;
  --gold:#c9a96e; --gold2:#e8c99a;
  --green:#4caf7d; --red:#e05c5c; --amber:#d4a017; --amber2:#ff8080;
  --r:12px; --r2:8px;
}
body{background:var(--bg);color:var(--txt);font-family:'DM Sans',sans-serif;font-size:17.5px;min-height:100dvh}
h1,h2{font-weight:400}
#app{max-width:480px;margin:0 auto;min-height:100dvh;padding-bottom:90px}
.header{padding:18px 20px 4px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.header-left{display:flex;align-items:center;gap:10px}
.logo-corner{width:38px;height:38px;border-radius:50%;object-fit:cover;border:1px solid var(--border2);flex-shrink:0}
.header-titulo p{font-size:13px;color:var(--txt2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px;font-weight:500}
.header-titulo h1{font-family:'DM Serif Display',serif;font-size:22px;color:var(--gold2)}
.btn-icon{width:40px;height:40px;border-radius:50%;background:var(--bg2);border:1px solid var(--border);color:var(--txt2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.tabs{display:flex;gap:8px;padding:0 20px;margin:14px 0 4px}
.tab-btn{flex:1;text-align:center;padding:10px 4px;border-radius:var(--r2);background:var(--bg2);border:1px solid var(--border);color:var(--txt2);font-size:13.5px;cursor:pointer;font-weight:500}
.tab-btn.active{background:var(--gold);color:#1a1200;border-color:var(--gold)}
.section{padding:0 20px;margin-bottom:16px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.card-balance{background:var(--bg2);border:1px solid rgba(201,169,110,.3);border-radius:var(--r);padding:16px;margin-bottom:10px}
.card-balance .label{font-size:13px;color:var(--txt2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;font-weight:500}
.card-balance .valor{font-family:'DM Serif Display',serif;font-size:28px;color:var(--gold2)}
.alerta-baja{background:rgba(224,92,92,.12);border:1px solid rgba(224,92,92,.35);color:var(--red);font-size:14px;border-radius:var(--r2);padding:9px 11px;margin-top:8px}
.alerta-ok{background:rgba(76,175,125,.12);border:1px solid rgba(76,175,125,.35);color:var(--green);font-size:14px;border-radius:var(--r2);padding:9px 11px;margin-top:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card-sm{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:10px;text-align:center}
.card-sm .lbl{font-size:12px;color:var(--txt2);margin-bottom:4px;font-weight:500}
.card-sm .val{font-size:16.5px;font-weight:500}
.grid-acciones{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn-accion{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:13px 8px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px}
.btn-accion:active{background:var(--bg3)}
.btn-accion .ico{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600}
.btn-accion .ico.a{background:rgba(76,175,125,.15);color:var(--green)}
.btn-accion .ico.b{background:rgba(224,92,92,.15);color:var(--red)}
.btn-accion .ico.c{background:rgba(201,169,110,.15);color:var(--gold2)}
.btn-accion span.lbl{font-size:14px;color:var(--txt);font-weight:500}
.section-title{font-size:14px;color:var(--txt2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;font-weight:500;display:flex;align-items:center;justify-content:space-between}
.filtros{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.filtros input,.filtros select{flex:1;min-width:90px;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;color:var(--txt);font-size:15px;padding:9px 9px}
.item-row{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.item-row .info p.nom{font-size:16px;font-weight:500}
.item-row .info p.sub{font-size:13px;color:var(--txt2);margin-top:2px}
.item-row .der{display:flex;align-items:center;gap:8px}
.item-row .monto{font-size:16px;font-weight:500;white-space:nowrap}
.item-row .monto.entrada{color:var(--green)}
.item-row .monto.salida{color:var(--red)}
.item-row .acciones{display:flex;gap:4px}
.item-row .acciones button{width:28px;height:28px;border-radius:50%;background:var(--bg3);border:1px solid var(--border2);color:var(--txt2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px}
.vacio{text-align:center;color:var(--txt2);font-size:15px;padding:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:var(--r2);cursor:pointer;font-size:16.5px;font-weight:500;padding:13px 18px}
.btn-full{width:100%}
.btn-primary{background:var(--gold);color:#1a1200}
.btn-secondary{background:var(--bg3);color:var(--txt);border:1px solid var(--border2)}
.btn-danger{background:rgba(224,92,92,.15);color:var(--red);border:1px solid rgba(224,92,92,.3)}
.btn-sm{padding:8px 12px;font-size:13.5px}
.form-group{margin-bottom:13px}
.form-label{display:block;font-size:14.5px;color:var(--txt);margin-bottom:6px;font-weight:500}
.form-input{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;color:var(--txt);font-size:17px;padding:12px 13px}
.form-row{display:flex;gap:8px}
.form-row>*{flex:1;min-width:0}
.form-input{min-width:0}
.form-input[type="date"]{padding-left:8px;padding-right:4px;font-size:15.5px}
.form-input[type="number"]{padding-left:10px;padding-right:6px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:90}
.overlay.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--bg2);border-radius:16px 16px 0 0;transform:translateY(100%);transition:transform .25s;z-index:100;max-height:90vh;overflow-y:auto;padding:20px}
.drawer.show{transform:translateY(0)}
.drawer-title{font-size:18px;margin-bottom:16px;font-family:'DM Serif Display',serif;color:var(--gold2)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--bg4);color:var(--txt);padding:10px 18px;border-radius:20px;font-size:13px;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:90vw;text-overflow:ellipsis;overflow:hidden}
.toast.show{opacity:1}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12.5px;font-weight:500;white-space:nowrap}
.badge.pendiente{background:rgba(212,160,23,.15);color:var(--amber)}
.badge.vencido{background:rgba(224,92,92,.15);color:var(--red)}
.badge.mora{background:rgba(224,92,92,.32);color:var(--amber2)}
.badge.pagado{background:rgba(76,175,125,.15);color:var(--green)}
.producto-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.producto-card .nom{font-size:17.5px;font-weight:600}
.producto-card .sub{font-size:14.5px;color:var(--txt2);margin-top:3px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:34px;height:34px;border-radius:50%;background:var(--bg3);border:1px solid var(--border2);color:var(--txt);font-size:18px;cursor:pointer}
.stepper .cant{min-width:26px;text-align:center;font-size:17px;font-weight:600}
.cart-bar{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--bg3);border-top:1px solid var(--border2);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:80}
.cart-bar .info p.lbl{font-size:12px;color:var(--txt2)}
.cart-bar .info p.val{font-size:18px;font-weight:500;color:var(--gold2)}
.chip{display:inline-block;background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:4px 10px;font-size:12.5px;margin:2px 4px 2px 0;color:var(--txt2)}
.combo-mini{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r2);padding:10px 12px;margin-bottom:8px}
.combo-mini .top{display:flex;justify-content:space-between;font-size:14.5px;font-weight:500;margin-bottom:4px}
.combo-mini .meta{font-size:12.5px;color:var(--txt2)}
</style>
</head>

async function gsSyncAll(){
  const res = await fetch(GS_URL + '?secret=' + encodeURIComponent(GS_SECRET) + '&action=syncAll');
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || 'Error de sincronización');
  return json.data;
}
async function gsWrite(action, entity, data){
  const res = await fetch(GS_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({secret:GS_SECRET, action, entity, data})
  });
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || 'Error al guardar');
  return json.data;
}

const COLECCIONES = ['frutosSecos','merma','presentaciones','combos','clientes','ventas','abonos','movimientos'];

window.DB = {
  _get(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch{ return null; } },
  _set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } },
  frutosSecos(){ return this._get('frutosSecos')||[]; },
  merma(){ return this._get('merma')||[]; },
  presentaciones(){ return this._get('presentaciones')||[]; },
  combos(){ return this._get('combos')||[]; },
  clientes(){ return this._get('clientes')||[]; },
  ventas(){ return this._get('ventas')||[]; },
  abonos(){ return this._get('abonos')||[]; },
  movimientos(){ return this._get('movimientos')||[]; },
  config(){ return this._get('config')||{}; },
  async crear(entity, data){
    const r = await gsWrite('create', entity, data);
    await syncData(true);
    return r;
  },
  async actualizar(entity, data){
    await gsWrite('update', entity, data);
    await syncData(true);
  },
  async eliminar(entity, id){
    await gsWrite('delete', entity, {id});
    await syncData(true);
  },
  async setConfig(key, value){
    await gsWrite('create', 'config', {key, value});
    await syncData(true);
  },
  async reiniciarTodo(){
    await gsWrite('resetAll', null, {});
    COLECCIONES.forEach(c=> DB._set(c, []));
    DB._set('config', {});
  },
  test(){ try{ localStorage.setItem('_t','1'); localStorage.removeItem('_t'); return true; }catch(e){ return false; } }
};

let _lastSync = 0;
let _syncInProgress = false;
async function syncData(force){
  const ahora = Date.now();
  if(!force && _syncInProgress) return;
  if(!force && (ahora - _lastSync) < 10000) return;
  _syncInProgress = true;
  try{
    const data = await gsSyncAll();
    COLECCIONES.forEach(c=> DB._set(c, data[c] || []));
    DB._set('config', data.config || {});
    _lastSync = Date.now();
  } catch(e){ console.error('Sync error:', e); }
  finally{ _syncInProgress = false; }
}

const fmt=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n||0);
const fmtNum=n=>new Intl.NumberFormat('es-CO',{maximumFractionDigits:2}).format(n||0);
const fmtDate=d=>d?new Date(String(d).slice(0,10)+'T12:00:00').toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'}):'—';
const fmtDateCorta=d=>{ if(!d) return '—'; const dt=new Date(String(d).slice(0,10)+'T12:00:00'); const dd=String(dt.getDate()).padStart(2,'0'); const mm=String(dt.getMonth()+1).padStart(2,'0'); const yy=String(dt.getFullYear()).slice(2); return dd+'/'+mm+'/'+yy; };
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Bogota',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
// Muestra una cantidad en kg como gramos si es menor a 1 kg, o en kilos si es 1 kg o más.
const fmtKg=kg=>{ const n = Number(kg)||0; return Math.abs(n) < 1 ? (fmtNum(n*1000)+' g') : (fmtNum(n)+' kg'); };

function mostrarToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}
function openDrawer(html){
  document.getElementById('drawer-content').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('overlay').style.pointerEvents='auto';
  document.getElementById('drawer').classList.add('show');
}
function closeDrawer(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('overlay').style.pointerEvents='none';
  document.getElementById('drawer').classList.remove('show');
}

// ═══════════════════════════════════════
// CAPA DE CÁLCULO — FASE 1 (Materia prima / Combos)
// ═══════════════════════════════════════
function kgCompradoTotal(nombre){
  return DB.frutosSecos().filter(f=>f.nombre===nombre).reduce((s,f)=>s+(Number(f.kg)||0),0);
}
function kgMermaTotal(nombre){
  return DB.merma().filter(m=>m.fruto_nombre===nombre).reduce((s,m)=>s+(Number(m.kg)||0),0);
}
function kgUsadoEnCombos(nombre){
  let total = 0;
  DB.combos().forEach(c=>{
    (c.ingredientes||[]).forEach(ing=>{ if(ing.nombre===nombre) total += (Number(ing.gramos)||0)/1000; });
  });
  return total;
}
function costoPorGramo(nombre){
  // Costo promedio ponderado por gramo, incluyendo el flete de cada compra
  // repartido de forma equitativa entre los kilos de esa misma compra.
  const lotes = DB.frutosSecos().filter(f=>f.nombre===nombre);
  let kgTotal=0, costoTotal=0;
  lotes.forEach(l=>{
    const kg = Number(l.kg)||0;
    kgTotal += kg;
    costoTotal += kg*(Number(l.costo_kg)||0) + (Number(l.transporte)||0);
  });
  if(kgTotal<=0) return 0;
  return (costoTotal/kgTotal)/1000;
}
function transporteTotalCompras(nombre){
  return DB.frutosSecos().filter(f=>f.nombre===nombre).reduce((s,f)=>s+(Number(f.transporte)||0),0);
}
function inversionPorFruto(nombre){
  return DB.frutosSecos().filter(f=>f.nombre===nombre).reduce((s,f)=>s+(Number(f.kg)||0)*(Number(f.costo_kg)||0)+(Number(f.transporte)||0),0);
}
// Proyecta cuánto quedaría "disponible" de un fruto si se cambia el kg de UNA compra
// (kgAntes -> kgDespues; usar kgDespues=0 para simular una eliminación).
// Si el resultado es negativo, significa que ya se comprometió (en merma o en combos)
// más materia prima de la que quedaría tras el cambio, y los cálculos de costo/inventario
// de ese fruto quedarían desincronizados con la realidad.
function proyectarDisponibleTrasCambioCompra(nombre, kgAntes, kgDespues){
  const compradoActual = kgCompradoTotal(nombre);
  const nuevoComprado = compradoActual - (Number(kgAntes)||0) + (Number(kgDespues)||0);
  const merma = kgMermaTotal(nombre);
  const usado = kgUsadoEnCombos(nombre);
  return nuevoComprado - merma - usado;
}
// Kardex de unidades de un producto (combo) en un rango de fechas [desde, hasta] (inclusive).
// Los lotes se agrupan por nombre + precio de venta (así "Mix" a $8.000 y "Mix" a $12.000 quedan separados).
// Entradas = bolsas/unidades producidas (fecha del lote). Salidas = bolsas/unidades vendidas (ventas activas,
// enlazadas por combo_id para no confundir con otro lote que tenga el mismo nombre y precio).
// Devuelve inventario inicial (todo lo anterior a "desde"), totales del rango, saldo final,
// y el detalle cronológico con el saldo acumulado después de cada movimiento.
function kardexProducto(nombre, precio, desde, hasta){
  const comboIds = DB.combos()
    .filter(c=>c.nombre===nombre && (Number(c.precio_venta||c.precio_sugerido)||0)===precio)
    .map(c=>c.id);

  const entradas = DB.combos().filter(c=>comboIds.indexOf(c.id)!==-1).map(c=>({
    fecha: String(c.fecha||'').slice(0,10), tipo:'producción', bolsas:(Number(c.bolsas)||0)
  }));
  const salidas = [];
  DB.ventas().filter(v=>!v.anulada).forEach(v=>{
    (v.items||[]).forEach(it=>{
      if(comboIds.indexOf(it.combo_id)!==-1){
        salidas.push({
          fecha: String(v.fecha||'').slice(0,10), tipo:'venta', bolsas:-(Number(it.bolsas)||0),
          metodoPago: v.metodo_pago, cliente: v.metodo_pago==='credito' ? (v.cliente_nombre||'') : ''
        });
      }
    });
  });
  const todos = entradas.concat(salidas).sort((a,b)=> a.fecha.localeCompare(b.fecha));

  const antes = todos.filter(m=>m.fecha < desde);
  const enRango = todos.filter(m=>m.fecha >= desde && m.fecha <= hasta);

  const inventarioInicial = antes.reduce((s,m)=>s+m.bolsas, 0);
  const totalEntradas = enRango.filter(m=>m.bolsas>0).reduce((s,m)=>s+m.bolsas, 0);
  const totalSalidas = -enRango.filter(m=>m.bolsas<0).reduce((s,m)=>s+m.bolsas, 0);
  const saldoFinal = inventarioInicial + totalEntradas - totalSalidas;

  let saldoAcumulado = inventarioInicial;
  const detalle = enRango.map(m=>{
    saldoAcumulado += m.bolsas;
    return Object.assign({}, m, {saldoAcumulado});
  });

  return {inventarioInicial, totalEntradas, totalSalidas, saldoFinal, detalle};
}
function nombresFrutosSecos(){
  const set = {};
  DB.frutosSecos().forEach(f=>{ set[f.nombre]=true; });
  return Object.keys(set);
}
function listaFrutosResumen(){
  return nombresFrutosSecos().map(nombre=>{
    const comprado = kgCompradoTotal(nombre);
    const merma = kgMermaTotal(nombre);
    const usado = kgUsadoEnCombos(nombre);
    const disponible = Math.max(comprado - merma - usado, 0);
    const costoGramo = costoPorGramo(nombre);
    const lotesFruto = DB.frutosSecos().filter(f=>f.nombre===nombre);
    const stockMinimo = lotesFruto.reduce((m,l)=>Math.max(m, Number(l.stock_minimo)||0), 0);
    const vencimientos = lotesFruto.map(l=>l.vencimiento).filter(Boolean).sort();
    return {
      nombre, comprado, merma, usado, disponible,
      costoGramo, costoKg: costoGramo*1000,
      stockMinimo, alerta: stockMinimo>0 && disponible < stockMinimo,
      proximoVencimiento: vencimientos[0]||null
    };
  });
}
function inversionMateriaPrimaTotal(){
  let total = 0;
  DB.frutosSecos().forEach(f=>{ total += (Number(f.kg)||0)*(Number(f.costo_kg)||0) + (Number(f.transporte)||0); });
  return total;
}
// ── Productos que se compran y se venden por unidad (no se mezclan) ──
// Se guardan como combos con tipo:'unidad' e ingredientes vacíos: así reutilizan
// toda la lógica de venta, inventario, caja y reportes que ya existe.
function esProductoUnidad(combo){
  return combo && combo.tipo === 'unidad';
}
// Dinero invertido en comprar productos por unidad (su costo total de compra).
function inversionProductosUnidad(){
  return DB.combos().filter(esProductoUnidad)
    .reduce((s,c)=> s + (Number(c.bolsas)||0)*(Number(c.costo_bolsa)||0), 0);
}
// Inversión total del negocio en mercancía: materia prima + productos por unidad.
function inversionTotalMercancia(){
  return inversionMateriaPrimaTotal() + inversionProductosUnidad();
}

function calcularCostoCombo({ingredientes, bolsas, costo_empaque_unit, costo_transporte}){
  let costoMateria = 0;
  (ingredientes||[]).forEach(ing=>{ costoMateria += (Number(ing.gramos)||0) * costoPorGramo(ing.nombre); });
  const empaque = (Number(bolsas)||0) * (Number(costo_empaque_unit)||0);
  const transporte = Number(costo_transporte)||0;
  const costoTotal = costoMateria + empaque + transporte;
  const costoBolsa = bolsas>0 ? costoTotal/bolsas : 0;
  return {costoMateria, empaque, transporte, costoTotal, costoBolsa};
}
function precioSugerido(costoBolsa, margenPct){
  const m = (margenPct===0) ? 0 : (Number(margenPct)||50);
  const bruto = costoBolsa * (1 + m/100);
  return Math.ceil(bruto/100)*100;
}

function bolsasVendidas(comboId){
  let total = 0;
  DB.ventas().forEach(v=>{
    if(v.anulada) return;
    (v.items||[]).forEach(it=>{ if(it.combo_id===comboId) total += Number(it.bolsas)||0; });
  });
  return total;
}
function listaCombosResumen(){
  return DB.combos().map(c=>{
    const vendidas = bolsasVendidas(c.id);
    const disponibles = Math.max((Number(c.bolsas)||0) - vendidas, 0);
    const precio = Number(c.precio_venta || c.precio_sugerido)||0;
    return Object.assign({}, c, {bolsas_vendidas:vendidas, bolsas_disponibles:disponibles, precio_efectivo:precio});
  });
}

// Sugeridor de mezclas: prioriza mayor stock disponible / próximos a vencer,
// prueba combinaciones simples, dobles y triples en distintas proporciones,
// filtra por margen objetivo y ordena por utilidad total y menor desperdicio.
function generarSugerencias(opts){
  opts = opts || {};
  const cfg = DB.config();
  const margenObjetivo = opts.margenObjetivo!=null ? opts.margenObjetivo : (Number(cfg.margen_objetivo_default)||50);
  const costoEmpaque = opts.costoEmpaque!=null ? opts.costoEmpaque : (Number(cfg.costo_empaque_default)||0);
  const presentaciones = opts.presentaciones || DB.presentaciones();
  let candidatos = (opts.frutos || listaFrutosResumen()).filter(f=>f.disponible>0.001);

  candidatos = candidatos.slice().sort((a,b)=>{
    if(a.proximoVencimiento && b.proximoVencimiento) return a.proximoVencimiento.localeCompare(b.proximoVencimiento);
    if(a.proximoVencimiento) return -1;
    if(b.proximoVencimiento) return 1;
    return b.disponible - a.disponible;
  });
  const top = candidatos.slice(0,5);
  if(top.length===0 || presentaciones.length===0) return [];

  const sets = [];
  top.forEach(f=> sets.push([{f, ratio:1}]) );
  const ratiosPar = [[0.7,0.3],[0.6,0.4],[0.5,0.5]];
  for(let i=0;i<top.length;i++) for(let j=i+1;j<top.length;j++){
    ratiosPar.forEach(r=> sets.push([{f:top[i],ratio:r[0]},{f:top[j],ratio:r[1]}]));
  }
  const ratiosTrio = [[0.5,0.3,0.2],[0.4,0.3,0.3]];
  for(let i=0;i<top.length;i++) for(let j=i+1;j<top.length;j++) for(let k=j+1;k<top.length;k++){
    ratiosTrio.forEach(r=> sets.push([{f:top[i],ratio:r[0]},{f:top[j],ratio:r[1]},{f:top[k],ratio:r[2]}]));
  }

  const resultados = [];
  sets.forEach(set=>{
    presentaciones.forEach(pres=>{
      const gramos = Number(pres.gramos)||0;
      if(gramos<=0) return;
      let costoGramoMix = 0;
      set.forEach(s=> costoGramoMix += s.ratio * s.f.costoGramo );
      const costoBolsa = costoGramoMix*gramos + costoEmpaque;
      const precio = precioSugerido(costoBolsa, margenObjetivo);
      const margenReal = costoBolsa>0 ? ((precio-costoBolsa)/costoBolsa*100) : 0;
      if(margenReal < margenObjetivo - 0.5) return;

      let maxBolsas = Infinity;
      set.forEach(s=>{
        const gramosNecesarios = gramos*s.ratio;
        if(gramosNecesarios<=0) return;
        const disponiblesGr = s.f.disponible*1000;
        maxBolsas = Math.min(maxBolsas, Math.floor(disponiblesGr/gramosNecesarios));
      });
      if(!isFinite(maxBolsas) || maxBolsas<=0) return;

      let kgUsadoTotal=0, kgDisponibleImplicado=0;
      set.forEach(s=>{ kgUsadoTotal += (maxBolsas*gramos*s.ratio)/1000; kgDisponibleImplicado += s.f.disponible; });
      const desperdicioKg = Math.max(kgDisponibleImplicado - kgUsadoTotal, 0);
      const utilidadTotal = maxBolsas*(precio-costoBolsa);

      resultados.push({
        ingredientes: set.map(s=>({nombre:s.f.nombre, pct:Math.round(s.ratio*100), gramos:Math.round(gramos*s.ratio)})),
        presentacion: pres.nombre, gramos,
        costoBolsa: Math.round(costoBolsa), precio, margenReal: Math.round(margenReal),
        maxBolsas, desperdicioKg: Math.round(desperdicioKg*1000)/1000, utilidadTotal: Math.round(utilidadTotal)
      });
    });
  });
  resultados.sort((a,b)=> b.utilidadTotal - a.utilidadTotal || a.desperdicioKg - b.desperdicioKg);
  return resultados.slice(0, opts.limite||6);
}

function planMetaGanancia(metaMonto){
  const combosDisp = listaCombosResumen().filter(c=>c.bolsas_disponibles>0);
  combosDisp.sort((a,b)=> (b.precio_efectivo-b.costo_bolsa) - (a.precio_efectivo-a.costo_bolsa));
  let acumulado=0; const plan=[];
  for(const c of combosDisp){
    if(acumulado>=metaMonto) break;
    const utilidadUnit = (Number(c.precio_efectivo)||0) - (Number(c.costo_bolsa)||0);
    if(utilidadUnit<=0) continue;
    const faltante = metaMonto-acumulado;
    const bolsasNecesarias = Math.min(c.bolsas_disponibles, Math.ceil(faltante/utilidadUnit));
    if(bolsasNecesarias<=0) continue;
    acumulado += bolsasNecesarias*utilidadUnit;
    plan.push({combo:c.nombre, id:c.id, bolsas:bolsasNecesarias, disponibles:c.bolsas_disponibles, utilidadUnit, subtotal:bolsasNecesarias*utilidadUnit});
  }
  return {plan, acumulado, cubierto: acumulado>=metaMonto, faltante: Math.max(metaMonto-acumulado,0)};
}

// CAPA DE CÁLCULO — FASE 2 (Ventas / Cartera / Caja)
// ═══════════════════════════════════════
function diasTranscurridos(fechaStr){
  const f = new Date(String(fechaStr).slice(0,10)+'T00:00:00');
  const hoy = new Date(today()+'T00:00:00');
  return Math.floor((hoy-f)/86400000);
}
function totalAbonadoVenta(ventaId){
  return DB.abonos().filter(a=>a.venta_id===ventaId).reduce((s,a)=>s+(Number(a.monto)||0),0);
}
function estadoCredito(venta){
  const abonado = totalAbonadoVenta(venta.id);
  const pendiente = Math.max((Number(venta.total)||0) - abonado, 0);
  if(pendiente<=0.5) return {estado:'pagado', pendiente:0, abonado, dias:0};
  const dias = diasTranscurridos(venta.fecha);
  let estado = 'pendiente';
  if(dias>=9) estado='mora'; else if(dias>=5) estado='vencido';
  return {estado, pendiente, abonado, dias};
}
function carteraCliente(clienteId, lugar){
  let ventasCliente = DB.ventas().filter(v=>!v.anulada && v.metodo_pago==='credito' && v.cliente_id===clienteId);
  if(lugar){ ventasCliente = ventasCliente.filter(v=> (v.lugar||'Sin lugar')===lugar); }
  let totalAdeudado = 0;
  const detalle = ventasCliente.map(v=>{
    const est = estadoCredito(v);
    totalAdeudado += est.pendiente;
    return Object.assign({}, v, est);
  }).sort((a,b)=> b.fecha.localeCompare(a.fecha));
  return {totalAdeudado, detalle};
}
function listaClientesResumen(lugar){
  return DB.clientes().map(cl=>{
    const cart = carteraCliente(cl.id, lugar);
    return Object.assign({}, cl, {totalAdeudado: cart.totalAdeudado, ventasCredito: cart.detalle.length});
  });
}
// Ranking de cartera pendiente agrupada por lugar de venta (para saber dónde se dio más crédito).
function carteraPorLugar(){
  const map = {};
  DB.ventas().filter(v=>!v.anulada && v.metodo_pago==='credito').forEach(v=>{
    const est = estadoCredito(v);
    if(est.pendiente<=0.5) return;
    const key = v.lugar || 'Sin lugar';
    if(!map[key]) map[key] = {lugar:key, total:0, ventas:0};
    map[key].total += est.pendiente;
    map[key].ventas += 1;
  });
  return Object.values(map).sort((a,b)=>b.total-a.total);
}
// Lugares usados alguna vez en ventas a crédito, para sugerir en el datalist del formulario.
function listaLugaresUsados(){
  const set = new Set();
  DB.ventas().forEach(v=>{ if(v.lugar) set.add(v.lugar); });
  return Array.from(set).sort((a,b)=>a.localeCompare(b));
}
// Cuánto quedaría disponible de un combo si esta venta (la que se está editando) no existiera.
// Se usa para validar cantidades al editar una venta sin bloquear al usuario por su propia venta actual.
function disponibleExcluyendoVenta(comboId, ventaId){
  const combo = DB.combos().find(c=>c.id===comboId);
  if(!combo) return 0;
  let vendidas = 0;
  DB.ventas().forEach(v=>{
    if(v.anulada) return;
    if(v.id===ventaId) return;
    (v.items||[]).forEach(it=>{ if(it.combo_id===comboId) vendidas += Number(it.bolsas)||0; });
  });
  return Math.max((Number(combo.bolsas)||0) - vendidas, 0);
}
function calcCaja(){
  const ventas = DB.ventas().filter(v=>!v.anulada);
  let efectivoVentas=0, costoVentasTotal=0, ingresosTotales=0;
  ventas.forEach(v=>{
    ingresosTotales += Number(v.total)||0;
    costoVentasTotal += Number(v.costo_total)||0;
    if(v.metodo_pago==='efectivo' || v.metodo_pago==='transferencia') efectivoVentas += Number(v.total)||0;
  });
  const abonosTotal = DB.abonos().reduce((s,a)=>s+(Number(a.monto)||0),0);
  const gastos = DB.movimientos().filter(m=>m.tipo==='gasto').reduce((s,m)=>s+(Number(m.monto)||0),0);
  const retiros = DB.movimientos().filter(m=>m.tipo==='retiro').reduce((s,m)=>s+(Number(m.monto)||0),0);
  const inyecciones = DB.movimientos().filter(m=>m.tipo==='inyeccion').reduce((s,m)=>s+(Number(m.monto)||0),0);

  const efectivoDisponible = efectivoVentas + abonosTotal + inyecciones - gastos - retiros;
  const carteraPendiente = ventas.filter(v=>v.metodo_pago==='credito').reduce((s,v)=> s + estadoCredito(v).pendiente, 0);
  const gananciaAcumulada = ingresosTotales - costoVentasTotal - gastos;
  const baseObjetivo = Number(DB.config().capital_reinversion)||0;
  const gananciaDisponibleRetiro = Math.max(0, efectivoDisponible - baseObjetivo);
  const faltaParaBase = Math.max(0, baseObjetivo - efectivoDisponible);
  return {efectivoDisponible, carteraPendiente, gananciaAcumulada, baseObjetivo, gananciaDisponibleRetiro, faltaParaBase, baseCompleta: baseObjetivo>0 ? efectivoDisponible>=baseObjetivo : true, retiros, gastos, abonosTotal, ingresosTotales, costoVentasTotal};
}
function calcInventarioFinal(){
  const combos = listaCombosResumen();
  let valorInversion=0, gananciaPotencial=0, bolsasTotal=0;
  combos.forEach(c=>{
    bolsasTotal += c.bolsas_disponibles;
    valorInversion += c.bolsas_disponibles*(Number(c.costo_bolsa)||0);
    gananciaPotencial += c.bolsas_disponibles*((Number(c.precio_efectivo)||0)-(Number(c.costo_bolsa)||0));
  });
  return {bolsasTotal, valorInversion, gananciaPotencial};
}
function rankingCombos(){
  const map = {};
  DB.ventas().filter(v=>!v.anulada).forEach(v=>{
    (v.items||[]).forEach(it=>{
      if(!map[it.combo_id]) map[it.combo_id]={nombre:it.nombre, bolsas:0, ingresos:0, utilidad:0};
      const b = Number(it.bolsas)||0;
      map[it.combo_id].bolsas += b;
      map[it.combo_id].ingresos += b*(Number(it.precio_unit)||0);
      map[it.combo_id].utilidad += b*((Number(it.precio_unit)||0)-(Number(it.costo_unit)||0));
    });
  });
  return Object.values(map).sort((a,b)=>b.utilidad-a.utilidad);
}
function rotacionDiasCombo(comboId, diasVentana){
  diasVentana = diasVentana||14;
  const desde = new Date(Date.now()-diasVentana*86400000);
  let vendidasVentana=0;
  DB.ventas().filter(v=>!v.anulada && new Date(String(v.fecha).slice(0,10)+'T00:00:00')>=desde).forEach(v=>{
    (v.items||[]).forEach(it=>{ if(it.combo_id===comboId) vendidasVentana += Number(it.bolsas)||0; });
  });
  const ritmoDiario = vendidasVentana/diasVentana;
  const combo = listaCombosResumen().find(c=>c.id===comboId);
  if(!combo || ritmoDiario<=0) return null;
  return Math.round(combo.bolsas_disponibles/ritmoDiario);
}

function renderCarteraClienteSeccion(){
  const clientesFiltrados = listaClientesResumen(_filtroLugarCartera).filter(c=>c.totalAdeudado>0.5).sort((a,b)=>b.totalAdeudado-a.totalAdeudado);
  document.getElementById('cartera-cliente-wrap').innerHTML = `
    <p style="font-size:12px;color:var(--txt3);margin:4px 0 8px">${clientesFiltrados.length} pendiente(s)${_filtroLugarCartera?(' en '+_filtroLugarCartera):''}</p>
    <div id="lista-cartera"></div>
  `;
  renderListaCartera(clientesFiltrados, _filtroLugarCartera);
}

function renderListaCartera(clientes, lugar){
  const cont = document.getElementById('lista-cartera');
  if(!cont) return;
  if(clientes.length===0){ cont.innerHTML = '<div class="vacio">Sin cartera pendiente 🎉</div>'; return; }
  cont.innerHTML = clientes.map(c=>{
    const cart = carteraCliente(c.id, lugar);
    const peorEstado = cart.detalle.reduce((peor,v)=>{
      const orden = {pagado:0, pendiente:1, vencido:2, mora:3};
      return orden[v.estado]>orden[peor] ? v.estado : peor;
    }, 'pagado');
    return `<div class="item-row" data-cliente="${c.id}">
      <div class="info">
        <p class="nom">${c.nombre}</p>
        <p class="sub"><span class="badge ${peorEstado}">${peorEstado}</span></p>
      </div>
      <div class="der"><div class="monto salida">${fmt(c.totalAdeudado)}</div></div>
    </div>`;
  }).join('');
  cont.querySelectorAll('[data-cliente]').forEach(el=>{
    el.addEventListener('click', function(){ abrirDetalleCliente(this.getAttribute('data-cliente')); });
  });
}

function abrirFormBaseCapital(){
  const cfg = DB.config();
  openDrawer(`
    <div class="drawer-title">Ajustar base de capital</div>
    <p style="font-size:13px;color:var(--txt2);margin-bottom:12px">Este es el monto que siempre se reserva para la próxima compra de frutos secos antes de considerar el resto como ganancia disponible.</p>
    <div class="form-group">
      <label class="form-label">Monto base ($)</label>
      <input class="form-input" id="fm-base" type="number" value="${cfg.capital_reinversion||0}">
    </div>
    <button class="btn btn-primary btn-full" id="btn-guardar-base">Guardar</button>
  `);
  document.getElementById('btn-guardar-base').addEventListener('click', async function(){
    const v = parseFloat(document.getElementById('fm-base').value)||0;
    this.disabled=true; this.textContent='Guardando...';
    try{
      await DB.setConfig('capital_reinversion', v);
      closeDrawer(); renderNegocio();
      setTimeout(()=>mostrarToast('✅ Base de capital actualizada'),100);
    } catch(e){ mostrarToast('❌ '+e.message); this.disabled=false; this.textContent='Guardar'; }
  });
}

const TIPO_MOV_LABEL = {retiro:'Retiro de ganancia', gasto:'Gasto operativo', inyeccion:'Inyección de capital extra', reinversion:'Reinversión de ganancia'};
function abrirFormMovimiento(tipo){
  const caja = calcCaja();
  const sugerido = tipo==='retiro' ? caja.gananciaDisponibleRetiro : '';
  openDrawer(`
    <div class="drawer-title">${TIPO_MOV_LABEL[tipo]}</div>
    ${tipo==='retiro' ? `<p style="font-size:13px;color:var(--txt2);margin-bottom:12px">Disponible para retirar sin tocar la base: ${fmt(caja.gananciaDisponibleRetiro)}</p>` : ''}
    <div class="form-group">
      <label class="form-label">Fecha</label>
      <input class="form-input" id="fm-fecha" type="date" value="${today()}">
    </div>
    <div class="form-group">
      <label class="form-label">${tipo==='gasto'?'Motivo del gasto':'Descripción (opcional)'}</label>
      <input class="form-input" id="fm-motivo" type="text" placeholder="${tipo==='gasto'?'Ej: Transporte, bolsas...':'Ej: Gastos personales'}">
    </div>
    <div class="form-group">
      <label class="form-label">Monto</label>
      <input class="form-input" id="fm-monto" type="number" placeholder="50000" value="${sugerido||''}">
    </div>
    <button class="btn btn-primary btn-full" id="btn-guardar-mov">Guardar</button>
  `);
  document.getElementById('btn-guardar-mov').addEventListener('click', async function(){
    const fecha = document.getElementById('fm-fecha').value;
    const motivo = document.getElementById('fm-motivo').value.trim();
    const monto = parseFloat(document.getElementById('fm-monto').value);
    if(!fecha){ alert('Selecciona una fecha'); return; }
    if(!monto || monto<=0){ alert('Ingresa un monto válido'); return; }
    this.disabled=true; this.textContent='Guardando...';
    try{
      await DB.crear('movimientos', {tipo, motivo, monto, fecha});
      closeDrawer(); renderNegocio();
      setTimeout(()=>mostrarToast('✅ Registrado'),100);
    } catch(e){ mostrarToast('❌ '+e.message); this.disabled=false; this.textContent='Guardar'; }
  });
}

  const movs = DB.movimientos().slice().sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||''));
  openDrawer(`

      <div class="item-row">

        </div>
      </div>

function abrirEditarMovimiento(mov){
  openDrawer(`
    <div class="drawer-title">Editar ${(TIPO_MOV_LABEL[mov.tipo]||mov.tipo).toLowerCase()}</div>
    <div class="form-group">
      <label class="form-label">Fecha</label>
      <input class="form-input" id="fm-fecha-mov-edit" type="date" value="${mov.fecha||today()}">
    </div>
    <div class="form-group">
      <label class="form-label">${mov.tipo==='gasto'?'Motivo del gasto':'Descripción (opcional)'}</label>
      <input class="form-input" id="fm-motivo-mov-edit" type="text" value="${mov.motivo||''}">
    </div>
    <div class="form-group">
      <label class="form-label">Monto</label>
      <input class="form-input" id="fm-monto-mov-edit" type="number" value="${mov.monto}">
    </div>
    <button class="btn btn-primary btn-full" id="btn-guardar-mov-edit" style="margin-bottom:8px">Guardar cambios</button>
    <button class="btn btn-danger btn-full" id="btn-eliminar-mov-edit">Eliminar</button>
  `);
  document.getElementById('btn-guardar-mov-edit').addEventListener('click', async function(){
    const monto = parseFloat(document.getElementById('fm-monto-mov-edit').value);
    if(!monto || monto<=0){ alert('Ingresa un monto válido'); return; }
    this.disabled=true; this.textContent='Guardando...';
    try{
      await DB.actualizar('movimientos', {id:mov.id, fecha:document.getElementById('fm-fecha-mov-edit').value||mov.fecha, motivo:document.getElementById('fm-motivo-mov-edit').value.trim(), monto});
      if(mov.tipo==='reinversion'){
        const diferencia = monto - (Number(mov.monto)||0);
        const nuevaBase = Math.max(0, (Number(DB.config().capital_reinversion)||0) + diferencia);
        await DB.setConfig('capital_reinversion', nuevaBase);
      }
      closeDrawer();
      abrirHistorialMovimientos();
      setTimeout(()=>mostrarToast('✅ Movimiento actualizado'),100);
    } catch(e){ mostrarToast('❌ '+e.message); this.disabled=false; this.textContent='Guardar cambios'; }
  });
  document.getElementById('btn-eliminar-mov-edit').addEventListener('click', async function(){
    const advertencia = mov.tipo==='reinversion' ? '¿Eliminar este movimiento? La base de capital se reducirá en '+fmt(mov.monto)+' para deshacer la reinversión.' : '¿Eliminar este movimiento?';
    if(!confirm(advertencia)) return;
    this.disabled=true; this.textContent='Eliminando...';
    try{
      await DB.eliminar('movimientos', mov.id);
      if(mov.tipo==='reinversion'){
        const nuevaBase = Math.max(0, (Number(DB.config().capital_reinversion)||0) - (Number(mov.monto)||0));
        await DB.setConfig('capital_reinversion', nuevaBase);
      }
      closeDrawer();
      abrirHistorialMovimientos();
      setTimeout(()=>mostrarToast('🗑 Movimiento eliminado'),100);
    } catch(e){ mostrarToast('❌ '+e.message); this.disabled=false; this.textContent='Eliminar'; }
  });
}

function abrirDetalleCliente(clienteId){
  const cliente = DB.clientes().find(c=>c.id===clienteId);
  if(!cliente) return;
  const cart = carteraCliente(clienteId);
  const puedeEliminar = cart.totalAdeudado<=0.5;
  openDrawer(`
    <div class="drawer-title">${cliente.nombre}</div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Nombre</label><input class="form-input" id="fm-nombre-cliente" value="${cliente.nombre}"></div>
      <div class="form-group"><label class="form-label">Teléfono (opcional)</label><input class="form-input" id="fm-telefono-cliente" type="text" value="${cliente.telefono||''}"></div>
    </div>
    <div class="form-group">
      <label class="form-label">Lugar</label>
      <input class="form-input" id="fm-lugar-cliente" type="text" list="lista-lugares-cliente-dl" value="${cliente.lugar||''}" placeholder="Ej: Oficina centro">
      <datalist id="lista-lugares-cliente-dl">${listaLugaresUsados().map(l=>`<option value="${l}">`).join('')}</datalist>
      <p style="font-size:11.5px;color:var(--txt3);margin-top:4px">Al guardar, se aplica a todas las ventas a crédito ya registradas de este cliente.</p>
    </div>
    <div class="form-group">
      <label class="form-label">Límite de crédito ($, 0 = sin límite)</label>
      <div class="form-row">
        <input class="form-input" id="fm-limite" type="number" value="${cliente.limite_credito||0}">
        <button class="btn btn-secondary" id="btn-guardar-limite">Guardar</button>
      </div>
    </div>
    ${puedeEliminar ? '<button class="btn btn-danger btn-full" id="btn-eliminar-cliente" style="margin-bottom:10px">Eliminar cliente</button>' : '<p style="font-size:12.5px;color:var(--txt2);margin-bottom:10px">No puedes eliminar este cliente mientras tenga cartera pendiente.</p>'}
    <p style="font-size:13px;color:var(--txt2);margin:10px 0 4px">Total adeudado: <b style="color:var(--txt)">${fmt(cart.totalAdeudado)}</b></p>
    <div class="section-title" style="margin-top:10px">Historial de pagos</div>
    <div>${cart.detalle.map(v=>`
      <div class="item-row">
        <div class="info">
          <p class="nom">${fmtDate(v.fecha)} — ${fmt(v.total)}</p>
          <p class="sub">Pendiente: ${fmt(v.pendiente)} · <span class="badge ${v.estado}">${v.estado}</span> ${v.dias?('· día '+v.dias):''}${v.lugar?(' · '+v.lugar):''}</p>
        </div>
        <div class="der">
          <div class="acciones"><button data-editar-venta-cliente="${v.id}" title="Editar venta">✎</button></div>
          ${v.abonado>0 ? `<button class="btn btn-secondary btn-sm" data-ver-abonos="${v.id}">Abonos</button>` : ''}
          ${v.pendiente>0 ? `<button class="btn btn-secondary btn-sm" data-abonar="${v.id}">Abonar</button>` : ''}
        </div>
      </div>`).join('') || '<div class="vacio">Sin ventas a crédito</div>'}
    </div>
  `);
  document.querySelectorAll('[data-editar-venta-cliente]').forEach(btn=>{
    btn.addEventListener('click', function(){
      abrirEditarVenta(this.getAttribute('data-editar-venta-cliente'), ()=>abrirDetalleCliente(clienteId));
    });
  });
  document.getElementById('btn-guardar-limite').addEventListener('click', async function(){
    const nombre = document.getElementById('fm-nombre-cliente').value.trim() || cliente.nombre;
    const telefono = document.getElementById('fm-telefono-cliente').value.trim();
    const lugar = document.getElementById('fm-lugar-cliente').value.trim();
    const limite_credito = parseFloat(document.getElementById('fm-limite').value)||0;
    if(limite_credito<0){ alert('El límite de crédito no puede ser un número negativo'); return; }
    this.disabled=true; this.textContent='Guardando...';
    try{
      await DB.actualizar('clientes', {id:clienteId, nombre, telefono, limite_credito, lugar});
      if(lugar){
        const ventasParaActualizar = DB.ventas().filter(v=>v.cliente_id===clienteId && !v.anulada && v.metodo_pago==='credito' && v.lugar!==lugar);
        for(const v of ventasParaActualizar){
          await DB.actualizar('ventas', {id:v.id, lugar});
        }
      }
      mostrarToast('✅ Datos actualizados');
      abrirDetalleCliente(clienteId);
    } catch(e){
      mostrarToast('❌ '+e.message);
      this.disabled=false; this.textContent='Guardar';
    }
  });
  const btnDelCliente = document.getElementById('btn-eliminar-cliente');
  if(btnDelCliente) btnDelCliente.addEventListener('click', async function(){
    if(!confirm('¿Eliminar este cliente? No se puede deshacer.')) return;
    this.disabled=true; this.textContent='Eliminando...';
    try{
      await DB.eliminar('clientes', clienteId);
      closeDrawer(); renderNegocio();
      setTimeout(()=>mostrarToast('🗑 Cliente eliminado'),100);
    } catch(e){ mostrarToast('❌ '+e.message); this.disabled=false; this.textContent='Eliminar cliente'; }
  });
  document.querySelectorAll('[data-abonar]').forEach(btn=>{
    btn.addEventListener('click', function(){ abrirFormAbono(this.getAttribute('data-abonar'), clienteId); });
  });
  document.querySelectorAll('[data-ver-abonos]').forEach(btn=>{
    btn.addEventListener('click', function(){ abrirListaAbonos(this.getAttribute('data-ver-abonos'), clienteId); });
  });
}

function abrirListaAbonos(ventaId, clienteId){
  const venta = DB.ventas().find(v=>v.id===ventaId);
  const abonos = DB.abonos().filter(a=>a.venta_id===ventaId).slice().sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  openDrawer(`
    <div class="drawer-title">Abonos de la venta</div>
    <p style="font-size:13px;color:var(--txt2);margin-bottom:12px">Total de la venta: <b style="color:var(--txt)">${fmt(venta.total)}</b></p>
    <div>${abonos.map(a=>`
      <div class="item-row">
        <div class="info"><p class="nom">${fmt(a.monto)}</p><p class="sub">${fmtDateCorta(a.fecha)}</p></div>
        <div class="der"><div class="acciones"><button data-editar-abono="${a.id}" title="Editar">✎</button></div></div>
      </div>
    `).join('') || '<div class="vacio">Sin abonos registrados</div>'}</div>
    <button class="btn btn-secondary btn-full" id="btn-volver-cliente" style="margin-top:10px">← Volver</button>
  `);
  document.querySelectorAll('[data-editar-abono]').forEach(btn=>{
    btn.addEventListener('click', function(){
      const a = DB.abonos().find(x=>x.id===this.getAttribute('data-editar-abono'));
      if(a) abrirEditarAbono(a, ventaId, clienteId);
    });
  });
  document.getElementById('btn-volver-cliente').addEventListener('click', function(){ abrirDetalleCliente(clienteId); });
}

function abrirEditarAbono(abono, ventaId, clienteId){
  const venta = DB.ventas().find(v=>v.id===ventaId);
  const estActual = venta ? estadoCredito(venta) : {pendiente:0};
  const pendienteSinEsteAbono = estActual.pendiente + (Number(abono.monto)||0); // lo que quedaría pendiente si este abono no existiera
  openDrawer(`

    </div>

        const items = (v.items||[]).map(i=>i.nombre+' ×'+i.bolsas).join(', ');

          </div>

      }).join('') || '<div class="vacio">Sin ventas registradas</div>'}</div>

  `;

    btn.addEventListener('click', function(){ reversarVenta(this.getAttribute('data-anular'), this); });
  });
  document.querySelectorAll('[data-editar-venta]').forEach(btn=>{
    btn.addEventListener('click', function(){ abrirEditarVenta(this.getAttribute('data-editar-venta')); });

function renderListaProductos(combos){
  const cont = document.getElementById('lista-productos');
  if(!cont) return;
  if(combos.length===0){ cont.innerHTML = '<div class="vacio">Aún no hay bolsas producidas. Ve a la pestaña Mezclas para armar combos.</div>'; return; }
  cont.innerHTML = combos.map(c=>{
    const cant = _carrito[c.id]||0;
    const esUnidad = esProductoUnidad(c);
    const presentacionTxt = (!esUnidad && Number(c.presentacion_gramos)>0) ? (c.presentacion_gramos+'g · ') : '';
    return `<div class="producto-card">
      <div>
        <div class="nom">${c.nombre} ${esUnidad?'<span class="badge pendiente">unidad</span>':''}</div>
        <div class="sub">${presentacionTxt}${fmt(c.precio_efectivo)} · disp: ${c.bolsas_disponibles}</div>
      </div>
      <div class="stepper">
        <button data-menos="${c.id}">−</button>
        <span class="cant" id="cant-${c.id}">${cant}</span>
        <button data-mas="${c.id}">+</button>
      </div>
    </div>`;
  }).join('');
  cont.querySelectorAll('[data-mas]').forEach(btn=>{
    btn.addEventListener('click', function(){
      const id = this.getAttribute('data-mas');
      const combo = combos.find(c=>c.id===id);
      const actual = _carrito[id]||0;
      if(actual >= combo.bolsas_disponibles){ mostrarToast('⚠️ No hay más disponibles'); return; }
      _carrito[id] = actual+1;
      document.getElementById('cant-'+id).textContent = _carrito[id];
      renderCartBar();
    });
  });
  cont.querySelectorAll('[data-menos]').forEach(btn=>{
    btn.addEventListener('click', function(){
      const id = this.getAttribute('data-menos');
      const actual = _carrito[id]||0;
      if(actual<=0) return;
      _carrito[id] = actual-1;
      if(_carrito[id]===0) delete _carrito[id];
      document.getElementById('cant-'+id).textContent = _carrito[id]||0;
      renderCartBar();
    });
  });
}

function carritoResumen(){
  const combos = listaCombosResumen();
  let total = 0, costoTotal = 0, items = [];
  Object.keys(_carrito).forEach(id=>{
    const cant = _carrito[id];
    if(cant<=0) return;
    const combo = combos.find(c=>c.id===id);
    if(!combo) return;
    const precio = Number(combo.precio_efectivo)||0;
    const costo = Number(combo.costo_bolsa)||0;
    total += cant*precio;
    costoTotal += cant*costo;
    items.push({combo_id:id, nombre:combo.nombre, bolsas:cant, precio_unit:precio, costo_unit:costo});
  });
  return {items, total, costoTotal};
}

function renderCartBar(){
  let bar = document.getElementById('cart-bar');
  const {items, total} = carritoResumen();
  if(items.length===0){ if(bar) bar.remove(); return; }
  const bolsas = items.reduce((s,i)=>s+i.bolsas,0);
  const html = `
    <div class="info">
      <p class="lbl">${bolsas} bolsa(s)</p>
      <p class="val">${fmt(total)}</p>
    </div>
    <button class="btn btn-primary" id="btn-confirmar-venta">Confirmar venta</button>
  `;
  if(!bar){
    bar = document.createElement('div');
    bar.className = 'cart-bar';
    bar.id = 'cart-bar';
    document.body.appendChild(bar);
  }
  bar.innerHTML = html;
  document.getElementById('btn-confirmar-venta').addEventListener('click', abrirConfirmarVenta);
}

    </div>

  `);
  document.getElementById('fm-cliente').addEventListener('input', function(){
    const fmLugar = document.getElementById('fm-lugar');
    if(fmLugar.value.trim()) return; // no sobreescribir lo que el usuario ya escribió
    const match = DB.clientes().find(c=>c.nombre.trim().toLowerCase()===this.value.trim().toLowerCase());
    if(match && match.lugar) fmLugar.value = match.lugar;
  });
  document.getElementById('fm-metodo').addEventListener('change', function(){
    const esCredito = this.value==='credito';
    document.getElementById('grupo-cliente').style.display = esCredito ? 'block' : 'none';
    document.getElementById('grupo-lugar').style.display = esCredito ? 'block' : 'none';
  });
  document.getElementById('btn-guardar-venta').addEventListener('click', async function(){

      clienteNombre = document.getElementById('fm-cliente').value.trim();
      lugar = document.getElementById('fm-lugar').value.trim();
      if(!clienteNombre){ alert('Escribe el nombre de la persona'); return; }
      if(!lugar){ alert('Escribe el lugar de venta'); return; }
    }
    this.disabled = true; this.textContent = 'Guardando...';
    try{
      let clienteId = null;
      if(metodo==='credito'){
        let cliente = DB.clientes().find(c=>c.nombre.toLowerCase()===clienteNombre.toLowerCase());
        if(cliente && cliente.limite_credito>0){
          const cart = carteraCliente(cliente.id);
          if(cart.totalAdeudado + total > cliente.limite_credito){
            if(!confirm('Esta persona ya debe '+fmt(cart.totalAdeudado)+' y su límite es '+fmt(cliente.limite_credito)+'. ¿Continuar de todas formas?')){
              this.disabled=false; this.textContent='Registrar venta'; return;
            }
          }
        }
        if(!cliente){
          cliente = await DB.crear('clientes', {nombre:clienteNombre, telefono:'', limite_credito:0});
        }
        clienteId = cliente.id;
      }
      await DB.crear('ventas', {
        fecha: today(), cliente_id: clienteId, cliente_nombre: metodo==='credito' ? clienteNombre : '',
        metodo_pago: metodo, items, total, costo_total: costoTotal, anulada:false,
        lugar: metodo==='credito' ? lugar : ''
      });
      _carrito = {};
      closeDrawer();
      renderVenta();
      setTimeout(()=>mostrarToast('✅ Venta registrada'),100);
    } catch(e){ mostrarToast('❌ '+e.message); this.disabled=false; this.textContent='Registrar venta'; }

async function reversarVenta(ventaId, btn){
  if(!confirm('¿Anular esta venta? El inventario y la caja se ajustan automáticamente.')) return;
  if(btn){ btn.disabled = true; btn.textContent = '⏳'; }
  try{
    await DB.actualizar('ventas', {id:ventaId, anulada:true});
    mostrarToast('✅ Venta anulada');
    renderScreen();
  } catch(e){
    mostrarToast('❌ '+e.message);
    if(btn){ btn.disabled = false; btn.textContent = '✕'; }
  }
}

function abrirEditarVenta(ventaId, alVolver){
  const venta = DB.ventas().find(v=>v.id===ventaId);
  if(!venta || venta.anulada) return;
  const volver = typeof alVolver==='function' ? alVolver : renderVenta;
  const esCredito = venta.metodo_pago==='credito';
  const combosTodos = listaCombosResumen();
  let itemsEdit = (venta.items||[]).map(it=>Object.assign({}, it));

  function renderFilasItems(){
    if(itemsEdit.length===0) return '<div class="vacio">Sin productos. Agrega al menos uno.</div>';
    return itemsEdit.map((it, idx)=>{
      const maxDisp = disponibleExcluyendoVenta(it.combo_id, venta.id);
      return `<div class="item-row">
        <div class="info">
          <p class="nom">${it.nombre}</p>
          <p class="sub">${fmt(it.precio_unit)} c/u · máx ${maxDisp}</p>
        </div>
        <div class="stepper">
          <button data-item-menos="${idx}">−</button>
          <span class="cant" id="cant-item-${idx}">${it.bolsas}</span>
          <button data-item-mas="${idx}">+</button>
        </div>
        <div class="acciones"><button data-item-quitar="${idx}" title="Quitar">🗑</button></div>
      </div>`;
    }).join('');
  }
  function totalPreview(){ return itemsEdit.reduce((s,it)=>s+(Number(it.bolsas)||0)*(Number(it.precio_unit)||0), 0); }
  function opcionesAgregar(){
    return combosTodos.filter(c=>disponibleExcluyendoVenta(c.id, venta.id)>0)
      .map(c=>`<option value="${c.id}">${c.nombre}</option>`).join('');
  }

  openDrawer(`
    <div class="drawer-title">Editar venta</div>
    <div id="lista-items-edit">${renderFilasItems()}</div>
    <div class="form-group" style="margin-top:12px">
      <label class="form-label">Agregar producto</label>
      <select class="form-input" id="fm-agregar-producto">
        <option value="">Seleccionar producto...</option>
        ${opcionesAgregar()}
      </select>
    </div>
    ${esCredito ? `
    <div class="form-group">
      <label class="form-label">Lugar de venta</label>
      <input class="form-input" id="fm-lugar-edit" type="text" list="lista-lugares-edit-dl" value="${venta.lugar||''}">
      <datalist id="lista-lugares-edit-dl">${listaLugaresUsados().map(l=>`<option value="${l}">`).join('')}</datalist>
    </div>` : ''}
    <p style="font-size:20px;font-weight:500;color:var(--gold2);margin:14px 0" id="total-edit-preview">${fmt(totalPreview())}</p>
    <button class="btn btn-primary btn-full" id="btn-guardar-venta-edit">Guardar cambios</button>
  `);

  function refrescarUI(){
    document.getElementById('lista-items-edit').innerHTML = renderFilasItems();
    document.getElementById('total-edit-preview').textContent = fmt(totalPreview());
    document.getElementById('fm-agregar-producto').innerHTML = '<option value="">Seleccionar producto...</option>'+opcionesAgregar();
    bindFilas();
  }
  function bindFilas(){
    document.querySelectorAll('[data-item-mas]').forEach(btn=>{
      btn.addEventListener('click', function(){
        const idx = Number(this.getAttribute('data-item-mas'));
        const it = itemsEdit[idx];
        const maxDisp = disponibleExcluyendoVenta(it.combo_id, venta.id);
        if(it.bolsas >= maxDisp){ mostrarToast('⚠️ No hay más disponibles'); return; }
        it.bolsas += 1;
        refrescarUI();
      });
    });
    document.querySelectorAll('[data-item-menos]').forEach(btn=>{
      btn.addEventListener('click', function(){
        const idx = Number(this.getAttribute('data-item-menos'));
        if(itemsEdit[idx].bolsas>1) itemsEdit[idx].bolsas -= 1;
        refrescarUI();
      });
    });
    document.querySelectorAll('[data-item-quitar]').forEach(btn=>{
      btn.addEventListener('click', function(){
        const idx = Number(this.getAttribute('data-item-quitar'));
        itemsEdit.splice(idx,1);
        refrescarUI();
      });
    });
  }
  bindFilas();

  document.getElementById('fm-agregar-producto').addEventListener('change', function(){
    const comboId = this.value;
    if(!comboId) return;
    const combo = combosTodos.find(c=>c.id===comboId);
    const existente = itemsEdit.find(it=>it.combo_id===comboId);
    const maxDisp = disponibleExcluyendoVenta(comboId, venta.id);
    if(existente){
      if(existente.bolsas >= maxDisp){ mostrarToast('⚠️ No hay más disponibles'); this.value=''; return; }
      existente.bolsas += 1;
    } else {
      if(maxDisp<=0){ mostrarToast('⚠️ Sin disponibles'); this.value=''; return; }
      itemsEdit.push({combo_id:comboId, nombre:combo.nombre, bolsas:1, precio_unit:Number(combo.precio_efectivo)||0, costo_unit:Number(combo.costo_bolsa)||0});
    }
    this.value='';
    refrescarUI();
  });

  document.getElementById('btn-guardar-venta-edit').addEventListener('click', async function(){
    if(itemsEdit.length===0){ alert('La venta debe tener al menos un producto'); return; }
    let lugar = venta.lugar||'';
    if(esCredito){
      lugar = document.getElementById('fm-lugar-edit').value.trim();
      if(!lugar){ alert('Escribe el lugar de venta'); return; }
    }
    const nuevoTotal = totalPreview();
    const nuevoCosto = itemsEdit.reduce((s,it)=>s+(Number(it.bolsas)||0)*(Number(it.costo_unit)||0), 0);
    if(esCredito){
      const abonado = totalAbonadoVenta(venta.id);
      if(nuevoTotal < abonado - 0.5){
        if(!confirm('Esta venta ya tiene abonos registrados por '+fmt(abonado)+'. El nuevo total ('+fmt(nuevoTotal)+') queda por debajo de lo abonado. ¿Continuar de todas formas?')) return;
      }
    }
    this.disabled = true; this.textContent = 'Guardando...';
    try{
      await DB.actualizar('ventas', {id:venta.id, items:itemsEdit, total:nuevoTotal, costo_total:nuevoCosto, lugar});
      closeDrawer();
      volver();
      setTimeout(()=>mostrarToast('✅ Venta actualizada'),100);
    } catch(e){ mostrarToast('❌ '+e.message); this.disabled=false; this.textContent='Guardar cambios'; }
  });
}

      <div id="lista-frutos"></div>
    </div>

    <div class="section">
      <div class="section-title">Combos producidos</div>
      <div id="lista-combos"></div>
    </div>
  `;
  bindHeaderEvents();
  renderListaFrutos(frutos);
  renderListaCombos(combosResumen);

  document.getElementById('btn-fruto').addEventListener('click', function(){ abrirFormFrutoSeco(); });
  document.getElementById('btn-presentacion').addEventListener('click', function(){ abrirFormPresentacion(); });
  document.getElementById('btn-merma').addEventListener('click', function(){ abrirFormMerma(); });
  document.getElementById('btn-sugerir').addEventListener('click', abrirSugerencias);
  document.getElementById('btn-manual').addEventListener('click', abrirComboManual);
  document.getElementById('btn-meta').addEventListener('click', abrirMetaGanancia);
  document.getElementById('btn-inventario').addEventListener('click', renderInventario);
  document.getElementById('btn-producto-unidad').addEventListener('click', function(){ abrirFormProductoUnidad(); });
  document.getElementById('link-ver-inventario').addEventListener('click', renderInventario);
}

function renderListaFrutos(frutos){
  const cont = document.getElementById('lista-frutos');
  if(!cont) return;
  if(frutos.length===0){ cont.innerHTML = '<div class="vacio">Aún no registras frutos secos</div>'; return; }
  cont.innerHTML = frutos.map(f=>`
    <div class="item-row" data-fruto="${f.nombre}" style="cursor:pointer">
      <div class="info">
        <p class="nom">${f.nombre} ${f.alerta?'<span class="badge vencido">stock bajo</span>':''}</p>
        <p class="sub">Disponible: ${fmtKg(f.disponible)} · ${fmt(f.costoKg)}/kg${f.proximoVencimiento?(' · vence '+fmtDateCorta(f.proximoVencimiento)):''}</p>
      </div>
      <div class="der">
        <div class="monto">${fmt(f.disponible*f.costoKg)}</div>
        <div class="acciones"><button data-vercompras="${f.nombre}" title="Ver / editar compras">✎</button></div>
      </div>
    </div>
  `).join('');
  cont.querySelectorAll('[data-fruto]').forEach(el=>{
    el.addEventListener('click', function(e){
      if(e.target.closest('[data-vercompras]')) return;
      abrirHistorialCompras(this.getAttribute('data-fruto'));
    });
  });
  cont.querySelectorAll('[data-vercompras]').forEach(btn=>{
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      abrirHistorialCompras(this.getAttribute('data-vercompras'));
    });
  });
}

function renderListaCombos(combos){
  const cont = document.getElementById('lista-combos');
  if(!cont) return;
  if(combos.length===0){ cont.innerHTML = '<div class="vacio">Aún no has producido combos</div>'; return; }
  cont.innerHTML = combos.map(c=>{
    const rot = rotacionDiasCombo(c.id);
    const esUnidad = esProductoUnidad(c);
    const unidadTxt = esUnidad ? 'unidades' : 'bolsas';
    const presentacionTxt = (!esUnidad && Number(c.presentacion_gramos)>0) ? (c.presentacion_gramos+'g · ') : '';
    return `<div class="item-row">
      <div class="info">
        <p class="nom">${c.nombre} ${esUnidad?'<span class="badge pendiente">por unidad</span>':''}</p>
        <p class="sub">${presentacionTxt}disp: ${c.bolsas_disponibles}/${c.bolsas} ${unidadTxt} · costo ${fmt(c.costo_bolsa)} · precio ${fmt(c.precio_efectivo)}${rot?(' · dura ~'+rot+' días'):''}</p>
      </div>
      <div class="der">
        <div class="acciones">
          <button data-kardex-producto="${c.id}" title="Kardex de unidades">📋</button>
          <button data-editar-combo="${c.id}" title="Editar">✎</button>
          <button data-ficha="${c.id}" title="Ficha PDF">📄</button>
        </div>
      </div>
    </div>`;
  }).join('');
  cont.querySelectorAll('[data-ficha]').forEach(btn=>{
    btn.addEventListener('click', function(){ generarFichaCombo(this.getAttribute('data-ficha'), this); });
  });
  cont.querySelectorAll('[data-editar-combo]').forEach(btn=>{
    btn.addEventListener('click', function(){
      const c = combos.find(x=>x.id===this.getAttribute('data-editar-combo'));
      if(c) abrirEditarCombo(c);
    });
  });
  cont.querySelectorAll('[data-kardex-producto]').forEach(btn=>{
    btn.addEventListener('click', function(){
      const c = combos.find(x=>x.id===this.getAttribute('data-kardex-producto'));
      if(c) abrirKardexProducto(c.nombre, Number(c.precio_efectivo)||0);
    });
  });
}

function abrirEditarCombo(combo){
  const esUnidad = esProductoUnidad(combo);
  const unidadTxt = esUnidad ? 'unidades' : 'bolsas';
  const vendidas = combo.bolsas_vendidas||0;
  openDrawer(`
    <div class="drawer-title">${esUnidad?'Editar producto por unidad':'Editar combo'}</div>
    <div class="form-group"><label class="form-label">Nombre</label><input class="form-input" id="fm-nombre-combo-edit" value="${combo.nombre}"></div>
    ${esUnidad ? `
    <div class="form-row">
      <div class="form-group"><label class="form-label">Unidades compradas</label><input class="form-input" id="fm-cantidad-combo-edit" type="number" step="1" value="${combo.bolsas}"></div>
      <div class="form-group"><label class="form-label">Costo por unidad</label><input class="form-input" id="fm-costo-combo-edit" type="number" value="${Number(combo.costo_bolsa)||0}"></div>
    </div>` : ''}
    <div class="form-group"><label class="form-label">Precio de venta${esUnidad?' por unidad':''}</label><input class="form-input" id="fm-precio-combo-edit" type="number" value="${Number(combo.precio_venta||combo.precio_sugerido)||0}"></div>
    <p style="font-size:12.5px;color:var(--txt2);margin-bottom:12px">${esUnidad?'':'Costo neto por bolsa: '+fmt(combo.costo_bolsa)+' · '}${combo.bolsas_disponibles}/${combo.bolsas} ${unidadTxt} disponibles${vendidas>0?(' · '+vendidas+' ya vendidas'):''}</p>
    <button class="btn btn-primary btn-full" id="btn-guardar-combo-edit" style="margin-bottom:8px">Guardar cambios</button>
    <button class="btn btn-danger btn-full" id="btn-eliminar-combo-edit">Eliminar ${esUnidad?'producto':'combo'}</button>
  `);
  document.getElementById('btn-guardar-combo-edit').addEventListener('click', async function(){
    const nombre = document.getElementById('fm-nombre-combo-edit').value.trim() || combo.nombre;
    const precio_venta = parseFloat(document.getElementById('fm-precio-combo-edit').value)||0;
    if(precio_venta<=0){ alert('Ingresa un precio de venta válido (mayor a 0)'); return; }
    const cambios = {id:combo.id, nombre, precio_venta};
    if(esUnidad){
      const cantidad = parseFloat(document.getElementById('fm-cantidad-combo-edit').value)||0;
      const costoUnit = parseFloat(document.getElementById('fm-costo-combo-edit').value)||0;
      if(cantidad<=0){ alert('Ingresa una cantidad válida (mayor a 0)'); return; }
      if(costoUnit<=0){ alert('Ingresa un costo por unidad válido (mayor a 0)'); return; }
      if(cantidad < vendidas){
        if(!confirm('⚠️ Ya vendiste '+vendidas+' unidades y estás dejando la cantidad comprada en '+cantidad+'. El inventario disponible quedaría en cero y las cifras no cuadrarían. ¿Guardar de todas formas?')) return;
      }
      cambios.bolsas = cantidad;
      cambios.costo_bolsa = costoUnit;
      cambios.costo_materia = cantidad*costoUnit;
      cambios.costo_total = cantidad*costoUnit;
      cambios.margen_pct = costoUnit>0 ? Math.round((precio_venta-costoUnit)/costoUnit*100) : 0;
    }
    this.disabled=true; this.textContent='Guardando...';
    try{
      await DB.actualizar('combos', cambios);
      closeDrawer(); renderMezclas();
      setTimeout(()=>mostrarToast(esUnidad?'✅ Producto actualizado':'✅ Combo actualizado'),100);
    } catch(e){ mostrarToast('❌ '+e.message); this.disabled=false; this.textContent='Guardar cambios'; }
  });
  document.getElementById('btn-eliminar-combo-edit').addEventListener('click', async function(){
    let msg;
    if(esUnidad){
      msg = vendidas>0
        ? '¿Eliminar este producto? Ya se vendieron '+vendidas+' unidades y esas ventas dejarán de tener producto asociado. No se puede deshacer.'
        : '¿Eliminar este producto? No se puede deshacer.';
    } else {
      msg = vendidas>0
        ? '¿Eliminar este combo? Ya se vendieron '+vendidas+' bolsas; al eliminarlo se devolverá TODA la materia prima usada (incluida la de las bolsas ya vendidas) al inventario disponible. No se puede deshacer.'
        : '¿Eliminar este combo? Se devolverá la materia prima usada al inventario disponible. No se puede deshacer.';
    }
    if(!confirm(msg)) return;
    this.disabled=true; this.textContent='Eliminando...';
    try{
      await DB.eliminar('combos', combo.id);
      closeDrawer(); renderMezclas();
      setTimeout(()=>mostrarToast(esUnidad?'🗑 Producto eliminado':'🗑 Combo eliminado'),100);
    } catch(e){ mostrarToast('❌ '+e.message); this.disabled=false; this.textContent='Eliminar '+(esUnidad?'producto':'combo'); }
  });
}

function abrirFormProductoUnidad(){
  const existentes = DB.combos().filter(esProductoUnidad)
    .slice().sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||''));
  openDrawer(`
    <div class="drawer-title">Producto por unidad</div>
    <p style="font-size:13px;color:var(--txt2);margin-bottom:14px">Para lo que compras y vendes por unidad, sin mezclarlo (ej: un coco, una barra). Entra directo al inventario listo para vender.</p>
    <div class="form-group"><label class="form-label">Nombre del producto</label><input class="form-input" id="fm-nombre-unidad" type="text" placeholder="Ej: Coco deshidratado"></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Unidades compradas</label><input class="form-input" id="fm-cantidad-unidad" type="number" step="1" placeholder="Ej: 24"></div>
      <div class="form-group"><label class="form-label">Costo por unidad</label><input class="form-input" id="fm-costo-unidad" type="number" placeholder="Ej: 1500"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Precio de venta</label><input class="form-input" id="fm-precio-unidad" type="number" placeholder="Ej: 2500"></div>
      <div class="form-group"><label class="form-label">Fecha</label><input class="form-input" id="fm-fecha-unidad" type="date" value="${today()}"></div>
    </div>
    <div class="card" id="resultado-unidad" style="margin-bottom:14px"></div>
    <button class="btn btn-primary btn-full" id="btn-guardar-unidad" style="margin-bottom:14px">Guardar producto</button>
    <div class="section-title">Productos por unidad registrados</div>
    <div id="lista-productos-unidad"></div>
  `);
  renderListaProductosUnidad(existentes);

  function recalcularUnidadPreview(){
    const cantidad = parseFloat(document.getElementById('fm-cantidad-unidad').value)||0;
    const costo = parseFloat(document.getElementById('fm-costo-unidad').value)||0;
    const precio = parseFloat(document.getElementById('fm-precio-unidad').value)||0;
    const cont = document.getElementById('resultado-unidad');
    if(cantidad<=0 || costo<=0){
      cont.innerHTML = '<p style="font-size:13px;color:var(--txt2)">Indica cuántas unidades compraste y cuánto te costó cada una.</p>';
      return;
    }
    const margen = precio>0 ? ((precio-costo)/costo*100) : 0;
    cont.innerHTML = `
      <p style="font-size:13px;color:var(--txt2)">Inversión total: <b style="color:var(--txt)">${fmt(cantidad*costo)}</b></p>
      ${precio>0 ? `<p style="font-size:13px;color:var(--txt2);margin-top:6px">Ganancia: <b style="color:${margen>=0?'var(--green)':'var(--red)'}">${fmt(precio-costo)} por unidad (margen ${margen.toFixed(1)}%)</b></p>
      <p style="font-size:13px;color:var(--txt2);margin-top:6px">Si vendes todo: <b style="color:var(--gold2)">${fmt(cantidad*(precio-costo))}</b> de ganancia</p>`
      : '<p style="font-size:13px;color:var(--txt2);margin-top:6px">Indica el precio de venta para ver tu margen.</p>'}
    `;
  }
  ['fm-cantidad-unidad','fm-costo-unidad','fm-precio-unidad'].forEach(id=>{
    document.getElementById(id).addEventListener('input', recalcularUnidadPreview);
  });
  recalcularUnidadPreview();

  document.getElementById('btn-guardar-unidad').addEventListener('click', async function(){
    const nombre = document.getElementById('fm-nombre-unidad').value.trim();
    const cantidad = parseFloat(document.getElementById('fm-cantidad-unidad').value)||0;
    const costo = parseFloat(document.getElementById('fm-costo-unidad').value)||0;
    const precio = parseFloat(document.getElementById('fm-precio-unidad').value)||0;
    if(!nombre){ alert('Escribe el nombre del producto'); return; }
    if(cantidad<=0){ alert('Ingresa una cantidad válida (mayor a 0)'); return; }
    if(costo<=0){ alert('Ingresa un costo por unidad válido (mayor a 0)'); return; }
    if(precio<=0){ alert('Ingresa un precio de venta válido (mayor a 0)'); return; }
    this.disabled=true; this.textContent='Guardando...';
    try{
      await DB.crear('combos', {
        nombre, ingredientes: [], presentacion_gramos: 0, bolsas: cantidad,
        costo_empaque_unit: 0, costo_transporte: 0,
        costo_materia: cantidad*costo, costo_total: cantidad*costo, costo_bolsa: costo,
        margen_pct: Math.round((precio-costo)/costo*100),
        precio_sugerido: precio, precio_venta: precio,
        tipo: 'unidad', fecha: document.getElementById('fm-fecha-unidad').value || today()
      });
      closeDrawer(); renderMezclas();
      setTimeout(()=>mostrarToast('✅ Producto agregado, listo para vender'),100);
    } catch(e){ mostrarToast('❌ '+e.message); this.disabled=false; this.textContent='Guardar producto'; }
  });
}

function renderListaProductosUnidad(lista){
  const cont = document.getElementById('lista-productos-unidad');
  if(!cont) return;
  if(lista.length===0){ cont.innerHTML = '<div class="vacio">Todavía no registras productos por unidad</div>'; return; }
  const resumen = listaCombosResumen();
  cont.innerHTML = lista.map(p=>{
    const r = resumen.find(x=>x.id===p.id) || p;
    return `<div class="item-row">
      <div class="info">
        <p class="nom">${p.nombre}</p>
        <p class="sub">disp: ${r.bolsas_disponibles}/${p.bolsas} unidades · costo ${fmt(p.costo_bolsa)} · precio ${fmt(p.precio_venta||p.precio_sugerido)}</p>
      </div>
      <div class="der"><div class="acciones"><button data-editar-unidad="${p.id}" title="Editar">✎</button></div></div>
