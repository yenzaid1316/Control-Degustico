      if(c) abrirEditarCombo(c);
    });
  });
}

// ---------- Formularios ----------
function abrirFormFrutoSeco(existente, volverA){
  const esEdicion = !!existente;
  openDrawer(`
    <div class="drawer-title">${esEdicion ? 'Editar compra de '+existente.nombre : 'Registrar compra de fruto seco'}</div>
    <div class="form-group">
      <label class="form-label">Nombre</label>
      <input class="form-input" id="fm-nombre" type="text" list="dl-frutos" placeholder="Ej: Almendra" value="${esEdicion?existente.nombre:''}" ${esEdicion?'disabled':''}>
      <datalist id="dl-frutos">${nombresFrutosSecos().map(n=>`<option value="${n}">`).join('')}</datalist>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Kilogramos</label><input class="form-input" id="fm-kg" type="number" step="0.01" placeholder="10" value="${esEdicion?existente.kg:''}"></div>
      <div class="form-group"><label class="form-label">Costo por kg</label><input class="form-input" id="fm-costokg" type="number" placeholder="25000" value="${esEdicion?existente.costo_kg:''}"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Transporte (opcional)</label><input class="form-input" id="fm-transporte" type="number" placeholder="0" value="${esEdicion?(existente.transporte||0):''}"></div>
      <div class="form-group"><label class="form-label">Fecha</label><input class="form-input" id="fm-fecha" type="date" value="${esEdicion?existente.fecha:today()}"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Vencimiento (opcional)</label><input class="form-input" id="fm-venc" type="date" value="${esEdicion?(existente.vencimiento||''):''}"></div>
      <div class="form-group"><label class="form-label">Alerta stock mínimo (kg)</label><input class="form-input" id="fm-stockmin" type="number" step="0.01" placeholder="1" value="${esEdicion?(existente.stock_minimo||''):''}"></div>
    </div>
    <button class="btn btn-primary btn-full" id="btn-guardar-fruto" style="margin-bottom:8px">${esEdicion?'Guardar cambios':'Guardar'}</button>
    ${esEdicion?'<button class="btn btn-danger btn-full" id="btn-eliminar-fruto">Eliminar esta compra</button>':''}
  `);
  document.getElementById('btn-guardar-fruto').addEventListener('click', async function(){
    const nombre = esEdicion ? existente.nombre : document.getElementById('fm-nombre').value.trim();
    const kg = parseFloat(document.getElementById('fm-kg').value);
    const costo_kg = parseFloat(document.getElementById('fm-costokg').value);
    const transporte = parseFloat(document.getElementById('fm-transporte').value)||0;
    const stock_minimo = parseFloat(document.getElementById('fm-stockmin').value)||0;
    if(!nombre){ alert('Escribe el nombre'); return; }
    if(!kg || kg<=0){ alert('Ingresa un peso válido'); return; }
    if(!costo_kg || costo_kg<=0){ alert('Ingresa un costo por kg válido'); return; }
    if(transporte<0){ alert('El transporte no puede ser un número negativo'); return; }
    if(stock_minimo<0){ alert('El stock mínimo no puede ser un número negativo'); return; }
    if(esEdicion){
      const proyectado = proyectarDisponibleTrasCambioCompra(existente.nombre, Number(existente.kg)||0, kg);
      if(proyectado < -0.001){
        if(!confirm('⚠️ Ya usaste (en mermas o combos) más '+existente.nombre+' del que quedaría disponible si guardas este cambio (faltarían '+fmtKg(Math.abs(proyectado))+'). El costo por gramo de este fruto puede quedar mal calculado. ¿Guardar de todas formas?')) return;
      }
    }
    this.disabled=true; this.textContent='Guardando...';
    const payload = {
      nombre, kg, costo_kg, transporte,
      fecha: document.getElementById('fm-fecha').value || today(),
      vencimiento: document.getElementById('fm-venc').value || '',
      stock_minimo
    };
    try{
      if(esEdicion){
        await DB.actualizar('frutosSecos', Object.assign({id:existente.id}, payload));
        closeDrawer();
        volverDespuesDeGuardarFruto(volverA);
        setTimeout(()=>mostrarToast('✅ Compra actualizada'),100);
      } else {
        await DB.crear('frutosSecos', payload);
        abrirConfirmarOtraCompra(volverA);
      }
    } catch(e){ mostrarToast('❌ '+e.message); this.disabled=false; this.textContent=esEdicion?'Guardar cambios':'Guardar'; }
  });
  const btnDel = document.getElementById('btn-eliminar-fruto');
  if(btnDel) btnDel.addEventListener('click', async function(){
    const proyectado = proyectarDisponibleTrasCambioCompra(existente.nombre, Number(existente.kg)||0, 0);
    let mensaje = '¿Eliminar esta compra? Se descontará del inventario disponible. No se puede deshacer.';
    if(proyectado < -0.001){
      mensaje = '⚠️ Ya usaste (en mermas o combos) más '+existente.nombre+' del que quedaría disponible si eliminas esta compra (faltarían '+fmtKg(Math.abs(proyectado))+'). El costo por gramo de este fruto puede quedar mal calculado. ¿Eliminar de todas formas?';
    }
    if(!confirm(mensaje)) return;
    this.disabled=true; this.textContent='Eliminando...';
    try{
      await DB.eliminar('frutosSecos', existente.id);
      closeDrawer();
      volverDespuesDeGuardarFruto(volverA);
      setTimeout(()=>mostrarToast('🗑 Compra eliminada'),100);
    } catch(e){ mostrarToast('❌ '+e.message); this.disabled=false; this.textContent='Eliminar esta compra'; }
  });
}

function abrirConfirmarOtraCompra(volverA){
  openDrawer(`
    <div class="drawer-title">✅ Compra registrada</div>
    <p style="font-size:14px;color:var(--txt2);margin-bottom:16px">¿Quieres registrar otra compra de fruto seco?</p>
    <button class="btn btn-primary btn-full" id="btn-otra-compra" style="margin-bottom:8px">+ Registrar otra compra</button>
    <button class="btn btn-secondary btn-full" id="btn-terminar-compra">Terminar</button>
  `);
  document.getElementById('btn-otra-compra').addEventListener('click', function(){
    abrirFormFrutoSeco(undefined, volverA);
  });
  document.getElementById('btn-terminar-compra').addEventListener('click', function(){
    closeDrawer();
    volverDespuesDeGuardarFruto(volverA);
    setTimeout(()=>mostrarToast('✅ Listo'),100);
  });
}

function abrirHistorialCompras(nombre){
  const lotes = DB.frutosSecos().filter(f=>f.nombre===nombre).slice().sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||''));
  openDrawer(`
    <div class="drawer-title">Compras de ${nombre}</div>
    <div>${lotes.map(l=>`
      <div class="item-row">
        <div class="info">
          <p class="nom">${fmtKg(l.kg)} a ${fmt(l.costo_kg)}/kg</p>
          <p class="sub">${fmtDateCorta(l.fecha)}${l.transporte?(' · transporte '+fmt(l.transporte)):''}</p>
        </div>
        <div class="der">
          <div class="acciones"><button data-editar-lote="${l.id}" title="Editar">✎</button></div>
        </div>
      </div>
    `).join('') || '<div class="vacio">Sin compras registradas</div>'}</div>
    <button class="btn btn-secondary btn-full" id="btn-nueva-compra" style="margin-top:10px">+ Registrar otra compra de ${nombre}</button>
  `);
  document.querySelectorAll('[data-editar-lote]').forEach(btn=>{
    btn.addEventListener('click', function(){
      const lote = DB.frutosSecos().find(f=>f.id===this.getAttribute('data-editar-lote'));
      if(lote) abrirFormFrutoSeco(lote, nombre);
    });
  });
  document.getElementById('btn-nueva-compra').addEventListener('click', function(){
    abrirFormFrutoSeco();

function abrirKardexProducto(nombre, precio){
  const hoy = today();
  const desdeDefault = hoy.slice(0,7)+'-01'; // primer día del mes actual

  function renderContenido(desde, hasta){
    const k = kardexProducto(nombre, precio, desde, hasta);
    const iconoTipo = {'producción':'⬆️', venta:'⬇️'};
    return `
      <div class="grid3" style="margin-bottom:12px">
        <div class="card-sm"><div class="lbl">Inv. inicial</div><div class="val">${fmtNum(k.inventarioInicial)}</div></div>
        <div class="card-sm"><div class="lbl">Entradas</div><div class="val" style="color:var(--green)">${fmtNum(k.totalEntradas)}</div></div>
        <div class="card-sm"><div class="lbl">Salidas</div><div class="val" style="color:var(--red)">${fmtNum(k.totalSalidas)}</div></div>
      </div>
      <div class="card-balance" style="margin-bottom:12px">
        <div class="label">Saldo final del periodo</div>
        <div class="valor">${fmtNum(k.saldoFinal)}</div>
      </div>
      <div class="section-title">Movimientos del periodo</div>
      <div>${k.detalle.map(m=>{
        const metodoTxt = m.tipo!=='venta' ? '' :
          (m.metodoPago==='credito' ? ('Crédito - '+(m.cliente||'Sin nombre'))
          : m.metodoPago==='transferencia' ? 'Transferencia' : 'Efectivo');
        return `<div class="item-row">
          <div class="info">
            <p class="nom">${iconoTipo[m.tipo]||''} ${m.tipo.charAt(0).toUpperCase()+m.tipo.slice(1)}${metodoTxt?(' · '+metodoTxt):''}</p>
            <p class="sub">${fmtDateCorta(m.fecha)} · saldo: ${fmtNum(m.saldoAcumulado)}</p>
          </div>
          <div class="der"><div class="monto ${m.bolsas>=0?'entrada':'salida'}">${m.bolsas>=0?'+':''}${fmtNum(m.bolsas)}</div></div>
        </div>`;
      }).join('') || '<div class="vacio">Sin movimientos en este periodo</div>'}</div>
    `;
  }

  openDrawer(`
    <div class="drawer-title">Kardex — ${nombre} (${fmt(precio)})</div>
    <div class="form-row" style="margin-bottom:12px">
      <div class="form-group"><label class="form-label">Desde</label><input class="form-input" id="fm-kardex-desde" type="date" value="${desdeDefault}"></div>
      <div class="form-group"><label class="form-label">Hasta</label><input class="form-input" id="fm-kardex-hasta" type="date" value="${hoy}"></div>
    </div>
    <div id="kardex-contenido">${renderContenido(desdeDefault, hoy)}</div>
  `);

  function recalcular(){
    const desde = document.getElementById('fm-kardex-desde').value || desdeDefault;
    const hasta = document.getElementById('fm-kardex-hasta').value || hoy;
    if(desde > hasta){ mostrarToast('⚠️ La fecha "Desde" no puede ser posterior a "Hasta"'); return; }
    document.getElementById('kardex-contenido').innerHTML = renderContenido(desde, hasta);
  }
  document.getElementById('fm-kardex-desde').addEventListener('change', recalcular);
  document.getElementById('fm-kardex-hasta').addEventListener('change', recalcular);
}

    <div id="lista-presentaciones-existentes"></div>
  `);

    if(!nombre || !gramos || gramos<=0){ alert('Completa nombre y gramos'); return; }
    this.disabled=true; this.textContent=esEdicion?'Guardando...':'Agregando...';
    try{
      if(esEdicion){
        await DB.actualizar('presentaciones', {id:existente.id, nombre, gramos});
        mostrarToast('✅ Presentación actualizada');
      } else {
        await DB.crear('presentaciones', {nombre, gramos});
        mostrarToast('✅ Presentación agregada');
      }
      abrirFormPresentacion();
    } catch(e){ mostrarToast('❌ '+e.message); this.disabled=false; this.textContent=esEdicion?'Guardar cambios':'Agregar'; }

      mostrarToast('🗑 Presentación eliminada');

function abrirConfirmarProduccion(s){
  const cfg = DB.config();
  const nombreDefault = s.ingredientes.map(i=>i.nombre+' '+i.gramos+'g').join(' + ');
  openDrawer(`
    <div class="drawer-title">Producir mezcla</div>
    <div class="form-group"><label class="form-label">Nombre del combo</label><input class="form-input" id="fm-nombre-combo" value="${nombreDefault}"></div>
    <div class="form-group">
      <label class="form-label">Por cada bolsa (${s.gramos}g)</label>
      <p style="font-size:14.5px;color:var(--txt)">${s.ingredientes.map(i=>i.nombre+': '+i.gramos+'g').join(' · ')}</p>
    </div>
    <p id="preview-total-mezcla" style="font-size:13px;color:var(--txt2);margin-bottom:10px">Total a mezclar para ${s.maxBolsas} bolsas: ${s.ingredientes.map(i=>i.nombre+' '+fmtNum(i.gramos*s.maxBolsas)+'g').join(' · ')}</p>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Bolsas a producir</label><input class="form-input" id="fm-bolsas" type="number" value="${s.maxBolsas}"></div>
      <div class="form-group"><label class="form-label">Costo empaque/bolsa</label><input class="form-input" id="fm-empaque" type="number" value="${cfg.costo_empaque_default||0}"></div>
    </div>
    <div class="form-group"><label class="form-label">Precio de venta</label><input class="form-input" id="fm-precio-combo" type="number" value="${s.precio}"></div>
    <div class="card" id="resultado-produccion" style="margin-bottom:14px"></div>
    <button class="btn btn-primary btn-full" id="btn-confirmar-produccion">Confirmar producción</button>
  `);
  function recalcularProduccionPreview(){
    const bolsas = parseFloat(document.getElementById('fm-bolsas').value)||0;
    document.getElementById('preview-total-mezcla').textContent = 'Total a mezclar para '+bolsas+' bolsas: '+s.ingredientes.map(i=>i.nombre+' '+fmtNum(i.gramos*bolsas)+'g').join(' · ');
    const costoEmpaque = parseFloat(document.getElementById('fm-empaque').value)||0;
    const transporte = 0; // el flete ya se incluye desde el registro de la compra del fruto seco
    const precio = parseFloat(document.getElementById('fm-precio-combo').value)||0;
    const cont = document.getElementById('resultado-produccion');
    if(bolsas<=0){ cont.innerHTML = '<p style="font-size:13px;color:var(--txt2)">Indica cuántas bolsas vas a producir.</p>'; return; }
    const ingredientesTotales = s.ingredientes.map(i=>({nombre:i.nombre, gramos: Math.round(i.gramos*bolsas)}));
    const costo = calcularCostoCombo({ingredientes: ingredientesTotales, bolsas, costo_empaque_unit:costoEmpaque, costo_transporte:transporte});
    const margenReal = costo.costoBolsa>0 ? ((precio-costo.costoBolsa)/costo.costoBolsa*100) : 0;
    cont.innerHTML = `
      <p style="font-size:13px;color:var(--txt2)">Costo neto por bolsa: <b style="color:var(--txt)">${fmt(costo.costoBolsa)}</b></p>
      <p style="font-size:13px;color:var(--txt2);margin-top:6px">Con precio de ${fmt(precio)}: <b style="color:${margenReal>=0?'var(--green)':'var(--red)'}">${fmt(precio-costo.costoBolsa)} por bolsa (margen ${margenReal.toFixed(1)}%)</b></p>
    `;
  }
  ['fm-bolsas','fm-empaque','fm-precio-combo'].forEach(id=>{
    document.getElementById(id).addEventListener('input', recalcularProduccionPreview);
  });
  recalcularProduccionPreview();
  document.getElementById('btn-confirmar-produccion').addEventListener('click', async function(){
    const bolsas = parseFloat(document.getElementById('fm-bolsas').value)||0;
    if(bolsas<=0){ alert('Ingresa una cantidad de bolsas válida'); return; }
    const costo_empaque_unit = parseFloat(document.getElementById('fm-empaque').value)||0;
    const costo_transporte = 0; // el flete ya se incluye desde el registro de la compra del fruto seco
    const precioVenta = parseFloat(document.getElementById('fm-precio-combo').value)||0;
    if(costo_empaque_unit<0){ alert('El empaque no puede ser negativo'); return; }
    if(precioVenta<=0){ alert('Ingresa un precio de venta válido (mayor a 0)'); return; }
    const ingredientes = s.ingredientes.map(i=>({nombre:i.nombre, gramos: Math.round(i.gramos*bolsas)}));
    const costo = calcularCostoCombo({ingredientes, bolsas, costo_empaque_unit, costo_transporte});
    this.disabled=true; this.textContent='Guardando...';
    try{
      await DB.crear('combos', {
        nombre: document.getElementById('fm-nombre-combo').value.trim()||'Mezcla',
        ingredientes, presentacion_gramos: s.gramos, bolsas,
        costo_empaque_unit, costo_transporte,
        costo_materia: costo.costoMateria, costo_total: costo.costoTotal, costo_bolsa: costo.costoBolsa,
        margen_pct: DB.config().margen_objetivo_default||50,
        precio_sugerido: s.precio,
        precio_venta: parseFloat(document.getElementById('fm-precio-combo').value)||s.precio,
        tipo: 'sugerido', fecha: today()
      });
      closeDrawer(); renderMezclas();
      setTimeout(()=>mostrarToast('✅ Combo producido, inventario actualizado'),100);
    } catch(e){ mostrarToast('❌ '+e.message); this.disabled=false; this.textContent='Confirmar producción'; }
  });
}

function renderFilasIngredientes(nombres){
  const cont = document.getElementById('filas-ingredientes');
  cont.innerHTML = _ingredientesManual.map((ing,idx)=>`
    <div class="form-row" style="margin-bottom:8px">
      <select class="form-input" data-idx="${idx}" data-campo="nombre">
        <option value="">Selecciona...</option>

      </select>
      <input class="form-input" type="number" placeholder="gramos/bolsa" data-idx="${idx}" data-campo="gramos" value="${ing.gramos}">
    </div>
  `).join('');
  cont.querySelectorAll('[data-campo]').forEach(el=>{
    el.addEventListener('input', function(){
      const idx = parseInt(this.getAttribute('data-idx'));
      const campo = this.getAttribute('data-campo');
      _ingredientesManual[idx][campo] = this.value;
    });

}
function leerIngredientesManual(){
  return _ingredientesManual.filter(i=>i.nombre && parseFloat(i.gramos)>0).map(i=>({nombre:i.nombre, gramos:parseFloat(i.gramos)}));
}
function calcularManualPreview(){
  const porBolsa = leerIngredientesManual(); // gramos por CADA bolsa
  const bolsas = parseFloat(document.getElementById('fm-bolsas-manual').value)||0;
  const costoEmpaque = parseFloat(document.getElementById('fm-empaque-manual').value)||0;
  const transporte = 0; // el flete ya se incluye desde el registro de la compra del fruto seco
  const precioDeseado = parseFloat(document.getElementById('fm-precio-manual').value)||0;
  const cont = document.getElementById('resultado-manual');
  if(porBolsa.length===0){
    cont.innerHTML = '<p style="font-size:13px;color:var(--txt2)">Agrega al menos un ingrediente con sus gramos por bolsa.</p>';
    return null;
  }
  if(bolsas<=0){
    cont.innerHTML = '<p style="font-size:13px;color:var(--txt2)">Indica cuántas bolsas vas a producir.</p>';
    return null;
  }
  const gramosBolsa = porBolsa.reduce((s,i)=>s+i.gramos,0);
  const ingredientesTotales = porBolsa.map(i=>({nombre:i.nombre, gramos: Math.round(i.gramos*bolsas)}));

  const frutos = listaFrutosResumen();
  const faltantes = [];
  ingredientesTotales.forEach(ing=>{
    const f = frutos.find(x=>x.nombre===ing.nombre);
    const disponibleGr = (f ? f.disponible : 0)*1000;
    if(ing.gramos > disponibleGr + 0.5) faltantes.push(ing.nombre+' (necesitas '+fmtNum(ing.gramos)+'g, tienes '+fmtNum(disponibleGr)+'g)');
  });

  const costo = calcularCostoCombo({ingredientes: ingredientesTotales, bolsas, costo_empaque_unit:costoEmpaque, costo_transporte:transporte});
  const margenDefault = DB.config().margen_objetivo_default || 50;
  const precio = precioDeseado>0 ? precioDeseado : precioSugerido(costo.costoBolsa, margenDefault);
  const margenReal = costo.costoBolsa>0 ? ((precio-costo.costoBolsa)/costo.costoBolsa*100) : 0;

  cont.innerHTML = `
    <p style="font-size:13px;color:var(--txt2)">Gramos por bolsa: <b style="color:var(--txt)">${porBolsa.map(i=>i.nombre+': '+fmtNum(i.gramos)+'g').join(' · ')}</b> (total ${fmtNum(gramosBolsa)}g/bolsa)</p>
    <p style="font-size:13px;color:var(--txt2);margin-top:6px">Total a mezclar para ${bolsas} bolsas: <b style="color:var(--txt)">${ingredientesTotales.map(i=>i.nombre+' '+fmtNum(i.gramos)+'g').join(' · ')}</b></p>
    <p style="font-size:13px;color:var(--txt2);margin-top:6px">Costo neto por bolsa (sin utilidad): <b style="color:var(--txt)">${fmt(costo.costoBolsa)}</b></p>
    ${precioDeseado>0
      ? `<p style="font-size:13px;color:var(--txt2);margin-top:6px">Con tu precio de ${fmt(precioDeseado)}, la ganancia es <b style="color:${margenReal>=0?'var(--green)':'var(--red)'}">${fmt(precio-costo.costoBolsa)} por bolsa (margen ${margenReal.toFixed(1)}%)</b></p>`
      : `<p style="font-size:13px;color:var(--txt2);margin-top:6px">Precio sugerido con margen de ${margenDefault}%: <b style="color:var(--gold2)">${fmt(precio)}</b></p>`}
    ${faltantes.length ? `<p style="font-size:13px;color:var(--red);margin-top:8px">⚠️ No tienes suficiente stock de: ${faltantes.join('; ')}</p>` : ''}
  `;
  return {ingredientesTotales, bolsas, gramosBolsa, costoEmpaque, transporte, precio, margenReal, costo, faltantes, presentacionGramos: Math.round(gramosBolsa)};
}
async function guardarComboManual(){
  const r = calcularManualPreview();
  if(!r){ mostrarToast('⚠️ Revisa los datos antes de guardar'); return; }
  if(r.costoEmpaque<0 || r.transporte<0){ mostrarToast('❌ El empaque y el transporte no pueden ser negativos'); return; }
  if(r.precio<=0){ mostrarToast('❌ Ingresa un precio de venta válido (mayor a 0)'); return; }
  if(r.faltantes && r.faltantes.length){
    if(!confirm('No tienes suficiente stock de: '+r.faltantes.join('; ')+'. ¿Producir de todas formas?')) return;
  }
  const btn = document.getElementById('btn-guardar-manual');
  btn.disabled = true; btn.textContent = 'Guardando...';
  try{
    await DB.crear('combos', {
      nombre: document.getElementById('fm-nombre-manual').value.trim() || 'Combo manual',
      ingredientes: r.ingredientesTotales,
      presentacion_gramos: r.presentacionGramos,
      bolsas: r.bolsas,
      costo_empaque_unit: r.costoEmpaque, costo_transporte: r.transporte,
      costo_materia: r.costo.costoMateria, costo_total: r.costo.costoTotal, costo_bolsa: r.costo.costoBolsa,
      margen_pct: Math.round(r.margenReal),
      precio_sugerido: r.precio, precio_venta: r.precio,
      tipo:'manual', fecha: today()
    });
    closeDrawer(); renderMezclas();
    setTimeout(()=>mostrarToast('✅ Combo producido, inventario actualizado'),100);
  } catch(e){ mostrarToast('❌ '+e.message); btn.disabled=false; btn.textContent='Producir combo'; }
}

// GENERADOR DE PDF ESTILO TARJETA
// ═══════════════════════════════════════
const PDF_W = 100;
const PDF_COL = {
  dark:[22,20,15], gold:[232,201,154], goldLabel:[154,111,36],
  labelTxt:[74,69,61], valueTxt:[26,26,26], altRow:[245,240,228],
  border:[225,220,208], subtitle:[214,208,196]
};
function pdfCrear(alturaMM){
  const {jsPDF} = window.jspdf;
  return new jsPDF({unit:'mm', format:[PDF_W, Math.max(alturaMM,60)]});
}
function pdfHeader(doc, titulo, subtitulo){
  doc.setFillColor.apply(doc, PDF_COL.dark);
  doc.rect(0,0,PDF_W,22,'F');
  doc.setTextColor(255,255,255);
  doc.setFont('helvetica','bold'); doc.setFontSize(13);
  doc.text(titulo, 8, 12);
  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  doc.setTextColor.apply(doc, PDF_COL.subtitle);
  doc.text(subtitulo, 8, 18);
  return 30;
}
function pdfFila(doc, y, label, valor, alterna){
  if(alterna){ doc.setFillColor.apply(doc, PDF_COL.altRow); doc.rect(0,y-4.5,PDF_W,7,'F'); }
  doc.setFont('helvetica','bold'); doc.setFontSize(9);
  doc.setTextColor.apply(doc, PDF_COL.labelTxt);
  doc.text(label, 8, y);
  doc.setTextColor.apply(doc, PDF_COL.valueTxt);
  doc.text(String(valor), PDF_W-8, y, {align:'right'});
  return y+7;
}
function pdfSeccionTitulo(doc, y, texto){
  doc.setFont('helvetica','bold'); doc.setFontSize(8);
  doc.setTextColor.apply(doc, PDF_COL.goldLabel);
  doc.text(texto.toUpperCase(), 8, y);
  return y+6;
}
function pdfFilaTabla(doc, y, col1, col2, col3){
  doc.setFont('helvetica','bold'); doc.setFontSize(8);
  doc.setTextColor.apply(doc, PDF_COL.labelTxt);
  doc.text(col1, 8, y);
  if(col2) doc.text(col2, 25, y);
  doc.setTextColor.apply(doc, PDF_COL.valueTxt);
  doc.text(col3, PDF_W-8, y, {align:'right'});
  doc.setDrawColor.apply(doc, PDF_COL.border);
  doc.setLineWidth(0.15);
  doc.line(8, y+2.3, PDF_W-8, y+2.3);
  return y+7.5;
}
function pdfCajaSaldo(doc, y, label, valor){
  const h = 16;
  doc.setFillColor.apply(doc, PDF_COL.dark);
  doc.roundedRect(8, y, PDF_W-16, h, 2, 2, 'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(9);
  doc.setTextColor(224,217,204);
  doc.text(label, 12, y+10);
  doc.setFontSize(14);
  doc.setTextColor.apply(doc, PDF_COL.gold);
  doc.text(String(valor), PDF_W-12, y+10.5, {align:'right'});
  return y+h+6;
}
async function compartirArchivo(blob, filename){
  try{
    const file = new File([blob], filename, {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:filename});
      return;
    }
  } catch(e){
    if(e.name==='AbortError') return;
    console.error('Share error:', e);
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
  mostrarToast('📄 PDF descargado — ábrelo y compártelo por WhatsApp');
}

async function generarFichaCombo(comboId, btn){
  const c = listaCombosResumen().find(x=>x.id===comboId);
  if(!c) return;
  const textoOriginal = btn ? btn.textContent : null;
  if(btn){ btn.disabled = true; btn.textContent = '⏳'; }
  try{
    const esUnidad = esProductoUnidad(c);
    const doc = pdfCrear(30+12+ (c.ingredientes||[]).length*7.5 + 40);
    let y = pdfHeader(doc, c.nombre, esUnidad ? 'Producto por unidad' : 'Ficha de producción');
    if(!esUnidad){
      y = pdfSeccionTitulo(doc, y, 'Ingredientes (total lote)');
      (c.ingredientes||[]).forEach(ing=>{
        y = pdfFilaTabla(doc, y, ing.nombre, '', fmtNum(ing.gramos)+' g');
      });
      y += 3;
      y = pdfFila(doc, y, 'Presentación', c.presentacion_gramos+' g', false);
    }
    y = pdfFila(doc, y, esUnidad?'Unidades compradas':'Bolsas producidas', String(c.bolsas), true);
    y = pdfFila(doc, y, 'Disponibles', String(c.bolsas_disponibles), false);
    y = pdfFila(doc, y, esUnidad?'Costo por unidad':'Costo por bolsa', fmt(c.costo_bolsa), true);
    y += 3;
    pdfCajaSaldo(doc, y, 'Precio de venta', fmt(c.precio_efectivo));
    const blob = doc.output('blob');
    await compartirArchivo(blob, 'ficha_'+c.nombre.replace(/\s+/g,'_')+'.pdf');
  } catch(e){ mostrarToast('❌ '+e.message); }
  if(btn){ btn.disabled = false; btn.textContent = textoOriginal; }
}

async function pdfReporteVentas(desde,hasta){
  let ventas = DB.ventas().filter(v=>!v.anulada && String(v.fecha).slice(0,10)>=desde && String(v.fecha).slice(0,10)<=hasta);
  if(ventas.length===0){ mostrarToast('⚠️ No hay ventas en ese rango'); return; }
  ventas.sort((a,b)=> a.fecha<b.fecha?-1:1);
  let totalIngresos=0, totalCosto=0;
  const doc = pdfCrear(30+12+ventas.length*7.5+30);
  let y = pdfHeader(doc, 'Reporte de ventas', fmtDate(desde)+' — '+fmtDate(hasta));
  y = pdfSeccionTitulo(doc, y, 'Ventas');
  ventas.forEach(v=>{
    totalIngresos += Number(v.total)||0; totalCosto += Number(v.costo_total)||0;
    let col2 = v.metodo_pago==='credito' ? ('Créd. '+v.cliente_nombre) : (v.metodo_pago==='transferencia'?'Transf.':'Efectivo');
    if(col2.length>18) col2 = col2.slice(0,17)+'…';
    y = pdfFilaTabla(doc, y, fmtDateCorta(v.fecha), col2, fmt(v.total));
  });
  y += 3;
  y = pdfFila(doc, y, 'Total ingresos', fmt(totalIngresos), false);
  y = pdfFila(doc, y, 'Costo de ventas', fmt(totalCosto), true);
  y += 3;
  pdfCajaSaldo(doc, y, 'Utilidad del período', fmt(totalIngresos-totalCosto));
  await compartirArchivo(doc.output('blob'), 'ventas_'+desde+'_a_'+hasta+'.pdf');
}

async function pdfReporteCartera(lugarFiltro){
  const ventasCredito = DB.ventas().filter(v=>!v.anulada && v.metodo_pago==='credito');
  let pendientes = ventasCredito.map(v=>Object.assign({}, v, estadoCredito(v))).filter(v=>v.pendiente>0.5);
  if(lugarFiltro){ pendientes = pendientes.filter(v=>(v.lugar||'Sin lugar')===lugarFiltro); }
  if(pendientes.length===0){ mostrarToast('⚠️ No hay cartera pendiente'+(lugarFiltro?(' en '+lugarFiltro):'')); return; }

  if(lugarFiltro){
    // Un solo lugar: no repetimos la columna de lugar en cada fila, ya va en el subtítulo
    let total=0;
    const doc = pdfCrear(30+12+pendientes.length*7.5+24);
    let y = pdfHeader(doc, 'Cartera pendiente', lugarFiltro+' · corte al '+fmtDate(today()));
    y = pdfSeccionTitulo(doc, y, 'Clientes');
    pendientes.forEach(v=>{
      total += v.pendiente;
      y = pdfFilaTabla(doc, y, v.cliente_nombre.slice(0,14), v.estado, fmt(v.pendiente));
    });
    y += 3;
    pdfCajaSaldo(doc, y, 'Total por cobrar', fmt(total));
    await compartirArchivo(doc.output('blob'), 'cartera_'+lugarFiltro.replace(/\s+/g,'_')+'_'+today()+'.pdf');
    return;
  }

  // Todos los lugares: agrupado por lugar con subtotal, para que el cobro sea ordenado por ruta
  const porLugar = {};
  pendientes.forEach(v=>{
    const key = v.lugar || 'Sin lugar';
    (porLugar[key] = porLugar[key] || []).push(v);
  });
  const lugares = Object.keys(porLugar).sort((a,b)=>
    porLugar[b].reduce((s,v)=>s+v.pendiente,0) - porLugar[a].reduce((s,v)=>s+v.pendiente,0)
  );
  let total = 0;
  const altura = 30 + lugares.length*15 + pendientes.length*7.5 + 32;
  const doc = pdfCrear(altura);
  let y = pdfHeader(doc, 'Cartera pendiente', 'Corte al '+fmtDate(today()));
  lugares.forEach(lugar=>{
    const filas = porLugar[lugar];
    let subtotal = 0;
    y = pdfSeccionTitulo(doc, y, lugar);
    filas.forEach(v=>{
      subtotal += v.pendiente;
      y = pdfFilaTabla(doc, y, v.cliente_nombre.slice(0,14), v.estado, fmt(v.pendiente));
    });
    y = pdfFila(doc, y, 'Subtotal', fmt(subtotal), true);
    y += 2;
    total += subtotal;
  });
  pdfCajaSaldo(doc, y, 'Total por cobrar', fmt(total));
  await compartirArchivo(doc.output('blob'), 'cartera_'+today()+'.pdf');
}

async function pdfReporteCierre(desde,hasta){
  const ventasRango = DB.ventas().filter(v=>!v.anulada && String(v.fecha).slice(0,10)>=desde && String(v.fecha).slice(0,10)<=hasta);
  const abonosRango = DB.abonos().filter(a=>String(a.fecha).slice(0,10)>=desde && String(a.fecha).slice(0,10)<=hasta);
  const efectivoRango = ventasRango.filter(v=>v.metodo_pago!=='credito').reduce((s,v)=>s+(Number(v.total)||0),0);
  const creditoRango = ventasRango.filter(v=>v.metodo_pago==='credito').reduce((s,v)=>s+(Number(v.total)||0),0);
  const abonosMonto = abonosRango.reduce((s,a)=>s+(Number(a.monto)||0),0);
  const caja = calcCaja();
  const doc = pdfCrear(90);
  let y = pdfHeader(doc, 'Cierre de caja', fmtDate(desde)+' — '+fmtDate(hasta));
  y = pdfSeccionTitulo(doc, y, 'Movimiento del período');
  y = pdfFila(doc, y, 'Ventas de contado', fmt(efectivoRango), false);
  y = pdfFila(doc, y, 'Ventas a crédito', fmt(creditoRango), true);
  y = pdfFila(doc, y, 'Abonos recibidos', fmt(abonosMonto), false);
  y += 3;
  y = pdfSeccionTitulo(doc, y, 'Estado general del negocio');
  y = pdfFila(doc, y, 'Efectivo disponible', fmt(caja.efectivoDisponible), false);
  y = pdfFila(doc, y, 'Cartera pendiente', fmt(caja.carteraPendiente), true);
  y = pdfFila(doc, y, 'Base de capital', fmt(caja.baseObjetivo), false);
  y += 3;
  pdfCajaSaldo(doc, y, 'Ganancia disponible', fmt(caja.gananciaDisponibleRetiro));
  await compartirArchivo(doc.output('blob'), 'cierre_'+desde+'_a_'+hasta+'.pdf');
}

    <div class="header">
      <button class="btn-icon" id="btn-back-cfg">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      </button>
      <div class="header-titulo" style="text-align:right"><h1 style="font-size:18px">Configuración</h1></div>
    </div>
    <div class="section">
      <div class="card">
        <div class="form-group">
          <label class="form-label">Base de capital para reinversión</label>
          <input class="form-input" id="cfg-base" type="number" value="${cfg.capital_reinversion||0}">
        </div>
        <div class="form-group">
          <label class="form-label">Margen objetivo por defecto (%)</label>
          <input class="form-input" id="cfg-margen" type="number" value="${cfg.margen_objetivo_default||50}">
        </div>
        <div class="form-group">
          <label class="form-label">Costo de empaque por bolsa (por defecto)</label>
          <input class="form-input" id="cfg-empaque" type="number" value="${cfg.costo_empaque_default||0}">
        </div>
        <button class="btn btn-primary btn-full" id="btn-guardar-cfg">Guardar</button>
      </div>
    </div>
    <div class="section">
      <div class="card">
        <p style="font-size:13px;color:var(--txt2);margin-bottom:12px">Respaldo de datos</p>
        <button class="btn btn-secondary btn-full" id="btn-exportar" style="margin-bottom:8px">⬇️ Descargar backup (JSON)</button>
      </div>
    </div>
    <div class="section">
      <div class="card" style="border-color:rgba(224,92,92,.4)">
        <p style="font-size:13px;color:var(--txt2);margin-bottom:4px">Zona de pruebas</p>
        <p style="font-size:12.5px;color:var(--txt3);margin-bottom:12px">Borra TODOS los registros (frutos secos, combos, ventas, cartera, clientes) y deja la app en cero, como recién instalada. Útil para hacer pruebas o para entregar la app limpia a otra persona. La configuración (margen, empaque, base de capital) también se borra.</p>
        <button class="btn btn-danger btn-full" id="btn-reiniciar-app">🗑 Borrar todos los registros</button>
      </div>
    </div>
  `;
  document.getElementById('btn-back-cfg').addEventListener('click', renderScreen);
  document.getElementById('btn-guardar-cfg').addEventListener('click', async function(){
    this.disabled = true; this.textContent = 'Guardando...';
    try{
      await DB.setConfig('capital_reinversion', parseFloat(document.getElementById('cfg-base').value)||0);
      await DB.setConfig('margen_objetivo_default', parseFloat(document.getElementById('cfg-margen').value)||50);
      await DB.setConfig('costo_empaque_default', parseFloat(document.getElementById('cfg-empaque').value)||0);
      mostrarToast('✅ Configuración guardada');
      setTimeout(renderScreen, 400);
    } catch(e){ mostrarToast('❌ '+e.message); this.disabled=false; this.textContent='Guardar'; }
  });
  document.getElementById('btn-exportar').addEventListener('click', function(){
    const datos = { version:1, fecha_exportacion:new Date().toISOString() };
    COLECCIONES.forEach(c=> datos[c]=DB[c]());
    datos.config = DB.config();
    const blob = new Blob([JSON.stringify(datos,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'degustico_backup_'+today()+'.json'; a.click();
    URL.revokeObjectURL(url);
    mostrarToast('📄 Backup descargado');
  });
  document.getElementById('btn-reiniciar-app').addEventListener('click', abrirConfirmarReinicio);
}

function abrirConfirmarReinicio(){
  openDrawer(`
    <div class="drawer-title" style="color:var(--red)">⚠️ Borrar todos los registros</div>
    <p style="font-size:14px;color:var(--txt2);margin-bottom:14px">Esta acción borra permanentemente todos los frutos secos, combos, ventas, cartera, clientes y configuración guardados en Google Sheets. No se puede deshacer. Descarga un backup antes si no estás segura.</p>
    <div class="form-group">
      <label class="form-label">Escribe <b style="color:var(--red)">BORRAR</b> para confirmar</label>
      <input class="form-input" id="fm-confirma-reinicio" type="text" autocomplete="off" placeholder="BORRAR">
    </div>
    <button class="btn btn-danger btn-full" id="btn-confirmar-reinicio" disabled style="opacity:.5">Borrar todo definitivamente</button>
  `);
  const input = document.getElementById('fm-confirma-reinicio');
  const btn = document.getElementById('btn-confirmar-reinicio');
  input.addEventListener('input', function(){
    const ok = this.value.trim().toUpperCase() === 'BORRAR';
    btn.disabled = !ok;
    btn.style.opacity = ok ? '1' : '.5';
  });
  btn.addEventListener('click', async function(){
    if(!confirm('Última confirmación: esto borra TODOS los datos de la app y de la hoja de Google Sheets. ¿Continuar?')) return;
    this.disabled = true; this.textContent = 'Borrando...';
    try{
      await DB.reiniciarTodo();
      _carrito = {};
      closeDrawer();
      _tab = 'negocio';
      renderScreen();
      setTimeout(()=>mostrarToast('✅ App reiniciada. Todos los registros fueron borrados.'), 150);
    } catch(e){ mostrarToast('❌ '+e.message); this.disabled=false; this.textContent='Borrar todo definitivamente'; }
  });
}

// ═══════════════════════════════════════
// ARRANQUE
// ═══════════════════════════════════════
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState==='visible') syncData(false);
});

(async function(){
  if(!DB.test()){
    document.getElementById('screen').innerHTML = '<div style="padding:40px 20px;text-align:center"><p style="color:var(--txt2)">Abre la app en un navegador normal (no incógnito restringido).</p></div>';
    return;
  }
  renderScreen();
  mostrarToast('🔄 Sincronizando...');
  await syncData(true);
  renderScreen();
  setTimeout(()=>mostrarToast('✅ Datos actualizados'), 300);
})();
</script>
</body>
</html>
